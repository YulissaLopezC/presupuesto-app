<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presupuesto · Comparativo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../assets/style.css?v=20261018"/>
  <style>
    /* ── Layout ─────────────────────────────────────────────
       Móvil: una columna de 680px máx.
       Escritorio (≥ 900px): resumen 5fr (fijo al hacer scroll) + categorías 7fr, gap 16px. */
    .cmp {
      max-width: 680px; margin: 0 auto;
      padding: 20px 20px 0;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    }
    .cmp .card { margin-bottom: 0; }
    .cmp-main { display: grid; gap: 14px; align-content: start; min-width: 0; }

    /* ── Título + selector de mes (igual que Inicio) ─────── */
    .cmp-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .cmp-head h1 {
      font-family: "Sora", sans-serif; font-size: 22px; font-weight: 600;
      letter-spacing: -0.02em; color: var(--text);
    }

    /* ── Cifras ──────────────────────────────────────────── */
    .num {
      font-family: "Sora", sans-serif; font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em; white-space: nowrap;
    }
    .num.over { color: var(--warning-text); }

    /* ── Resumen: uso total ──────────────────────────────── */
    .sum-amount { display: block; margin-top: 10px; }
    .sum-sub {
      font-family: "Sora", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-top: 8px;
    }
    .sum-card .progress-bar { height: 10px; margin-top: 16px; }
    .sum-finding { font-size: 15px; line-height: 1.5; color: var(--text); margin-top: 16px; }
    .sum-finding strong { font-weight: 600; }

    /* ── Tira de cifras (igual que "Este mes" en Inicio) ─── */
    .month-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; }
    .month-cell { padding: 14px 0; border-top: 1px solid var(--border-soft); }
    .month-cell:nth-child(odd)  { padding-right: 14px; }
    .month-cell:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--border-soft); }
    .month-cell .num { display: block; font-size: 18px; font-weight: 700; margin-top: 6px; color: var(--text); }
    .month-cell .num.over { color: var(--warning-text); }
    .month-cell .num.zero { color: var(--muted); }

    /* ── Chips de filtro (igual que Movimientos) ─────────── */
    .filters {
      display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); font-size: 13px; font-weight: 600;
      color: var(--text); cursor: pointer; background: var(--surface);
      white-space: nowrap; font-family: "Public Sans", sans-serif;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      display: inline-flex; align-items: center;
    }
    .chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }

    /* ── Encabezado de sección dentro de tarjeta ─────────── */
    .sect-hdr {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; min-height: 24px;
    }
    .sect-hdr h2 {
      font-family: "Public Sans", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sect-count { font-size: 13px; color: var(--muted); }
    .sect-link {
      font-size: 14px; font-weight: 600; color: var(--text);
      text-decoration: none; padding: 4px 0;
      border-bottom: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    .sect-link:hover { border-color: var(--text); }

    /* ── Filas de categoría (igual que Inicio) ───────────── */
    .rows { list-style: none; margin-top: 8px; }
    .row { padding: 14px 0; border-top: 1px solid var(--border-soft); }
    .row:first-child { border-top: none; }
    .row-line {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    }
    .row-name {
      font-size: 15px; font-weight: 600; color: var(--text);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row-amt { font-size: 16px; font-weight: 600; color: var(--text); }
    .row-amt.zero { color: var(--muted); }
    .row-meta {
      font-size: 13px; color: var(--muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row .num.row-meta { font-weight: 600; }
    .row .progress-bar { margin: 10px 0 8px; }

    /* ── Estados ─────────────────────────────────────────── */
    .cmp .empty-state { padding: 28px 12px; }
    .cmp .empty-state p { margin-top: 0; color: var(--text); }
    .cmp .empty-state .btn-ghost { display: inline-flex; align-items: center; margin-top: 14px; text-decoration: none; }
    .sk-line { height: 14px; }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .chip, .sect-link { transition: none; }
      .skeleton { animation: none; }
    }

    /* ── Escritorio ≥ 900px ──────────────────────────────── */
    @media (min-width: 900px) {
      .cmp {
        max-width: 1240px; padding: 32px;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px;
      }
      .cmp-main  { gap: 16px; }
      .cmp-head  { grid-column: 1 / -1; }
      .cmp-head h1 { font-size: 26px; }
      .sum-card  { align-self: start; position: sticky; top: 32px; }
    }
  </style>
</head>
<body>
  <main class="cmp">

    <div class="cmp-head">
      <h1>Comparativo</h1>
      <div id="month-selector-container"></div>
    </div>

    <!-- Resumen del mes: uso total del presupuesto -->
    <section class="card sum-card" id="sum-card" aria-live="polite">
      <div class="skeleton sk-line" style="width:45%;"></div>
      <div class="skeleton" style="height:38px;width:40%;margin-top:12px;"></div>
      <div class="skeleton sk-line" style="width:60%;margin-top:10px;"></div>
      <div class="skeleton" style="height:10px;margin-top:22px;border-radius:999px;"></div>
      <div class="skeleton" style="height:120px;margin-top:24px;"></div>
    </section>

    <div class="cmp-main">
      <div class="filters" id="filters" role="group" aria-label="Filtrar por tipo de gasto">
        <button class="chip active" data-filter="" type="button">Todos</button>
        <button class="chip" data-filter="GASTO BÁSICO" type="button">Básico</button>
        <button class="chip" data-filter="GASTO NO ESENCIAL" type="button">No esencial</button>
        <button class="chip" data-filter="AHORRO O INVERSIÓN" type="button">Ahorro</button>
      </div>

      <section class="card">
        <div class="sect-hdr">
          <h2>Categorías</h2>
          <span class="sect-count" id="cat-count"></span>
        </div>
        <ul class="rows" id="cat-list">
          <li class="row"><div class="skeleton" style="height:48px;"></div></li>
          <li class="row"><div class="skeleton" style="height:48px;"></div></li>
          <li class="row"><div class="skeleton" style="height:48px;"></div></li>
        </ul>
      </section>
    </div>

  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script type="module">
    import { requireAuth } from "../modules/auth.js?v=20261018";
    import { getExpenses, getBudget, getCategories } from "../modules/db.js?v=20261018";
    import { renderBottomNav, renderMonthSelector } from "../assets/ui.js?v=20261018";
    import { formatCOP, currentMonth, formatMonth, sumByCategory, buildComparison, formatName } from "../assets/utils.js?v=20261018";

    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

    let uid, selectedMonth, allData = [], categories = [], activeFilter = "", hasBudget = false;

    // "$ 1.234" → "$1.234" (formato del DESIGN.md); el signo negativo es "−"
    const money     = v => formatCOP(Math.abs(v)).replace(/\s/g, "");
    const esc       = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const monthName = m => formatMonth(m).split(" ")[0];

    const user = await requireAuth();
    uid = user.uid;
    selectedMonth = currentMonth();
    renderBottomNav("comparativo");

    renderMonthSelector("month-selector-container", selectedMonth, m => {
      selectedMonth = m;
      loadData();
    });
    categories = await getCategories(uid);
    await loadData();

    async function loadData() {
      const [expenses, budget] = await Promise.all([
        getExpenses(uid, { month: selectedMonth }),
        getBudget(uid, selectedMonth)
      ]);
      const actual     = sumByCategory(expenses);
      const comparison = buildComparison(budget?.categories || {}, actual);
      allData = comparison.map(row => {
        const catObj = categories.find(c => c.name === row.category);
        return { ...row, type: catObj?.type || "" };
      });
      hasBudget = Object.keys(budget?.categories || {}).length > 0;
      renderStats(budget, expenses);
      renderList();
    }

    // ── Resumen: uso total + tira de cifras ────────────────
    function renderStats(budget, expenses) {
      const totalBudget  = budget ? Object.values(budget.categories||{}).reduce((s,v)=>s+Number(v),0) : 0;
      const totalSpent   = expenses.reduce((s,e)=>s+Number(e.amount),0);
      const totalAvail   = Math.max(totalBudget - totalSpent, 0);
      const pct          = totalBudget > 0 ? Math.min(Math.round(totalSpent/totalBudget*100),100) : 0;
      const barCls       = pct >= 100 ? "over" : pct >= 80 ? "warn" : "";

      const over     = allData.filter(r => r.budgeted > 0 && r.actual > r.budgeted);
      const near     = allData.filter(r => r.budgeted > 0 && r.actual < r.budgeted && r.actual / r.budgeted >= 0.8);
      const full     = allData.filter(r => r.budgeted > 0 && r.actual === r.budgeted);
      const overSum  = over.reduce((s, r) => s + (r.actual - r.budgeted), 0);
      const el       = document.getElementById("sum-card");
      const mName    = monthName(selectedMonth);

      if (totalBudget <= 0) {
        el.innerHTML = `
          <span class="label">Uso del presupuesto en ${mName}</span>
          <p class="sum-finding" style="margin-top:12px;">No hay presupuesto para este mes. Créalo para comparar lo gastado contra lo planeado.</p>
          <a href="./budget.html" class="btn-ghost" style="display:inline-flex;align-items:center;margin-top:16px;text-decoration:none;">Ir a presupuesto</a>`;
        return;
      }

      let finding;
      if (!over.length && !near.length && !full.length) {
        finding = "Todas las categorías van por debajo del 80% de su tope.";
      } else {
        const parts = [];
        if (over.length === 1) {
          parts.push(`${esc(formatName(over[0].category))} se pasó por <strong class="num over">${money(over[0].actual - over[0].budgeted)}</strong>`);
        } else if (over.length > 1) {
          parts.push(`${over.length} categorías pasaron su tope por <strong class="num over">${money(overSum)}</strong> en total`);
        }
        if (near.length) {
          parts.push(`${near.length === 1 ? `${esc(formatName(near[0].category))} va` : `${near.length} categorías van`} por encima del 80%`);
        }
        if (full.length) {
          parts.push(`${full.length === 1 ? `${esc(formatName(full[0].category))} llegó a su tope` : `${full.length} categorías llegaron a su tope`}`);
        }
        finding = (parts.length > 1 ? parts.slice(0, -1).join(", ") + " y " + parts[parts.length - 1] : parts[0]) + ".";
        finding = finding.charAt(0).toUpperCase() + finding.slice(1);
      }

      const cells = [
        { label: "Presupuestado", value: money(totalBudget), cls: "" },
        { label: "Gastado",       value: money(totalSpent),  cls: totalSpent ? "" : "zero" },
        { label: "Disponible",    value: money(totalAvail),  cls: totalAvail ? "" : "zero" },
        { label: "Excedido",      value: overSum ? money(overSum) : money(0), cls: overSum ? "over" : "zero" }
      ];

      el.innerHTML = `
        <span class="label">Uso del presupuesto en ${mName}</span>
        <span class="amount-big ${pct >= 100 ? "negative" : "neutral"} num sum-amount">${pct}%</span>
        <div class="sum-sub">${money(totalSpent)} de ${money(totalBudget)}</div>
        <div class="progress-bar" role="img" aria-label="${pct}% del presupuesto usado">
          <div class="progress-fill ${barCls}" style="width:${pct}%;"></div>
        </div>
        <p class="sum-finding">${finding}</p>
        <div class="month-grid">
          ${cells.map(c => `
            <div class="month-cell">
              <span class="label">${c.label}</span>
              <span class="num ${c.cls}">${c.value}</span>
            </div>`).join("")}
        </div>`;
    }

    // ── Lista de categorías ────────────────────────────────
    function renderList() {
      const el       = document.getElementById("cat-list");
      const filtered = activeFilter ? allData.filter(r => r.type === activeFilter) : allData;
      const sorted   = filtered.sort((a,b) => (b.pct||0)-(a.pct||0));

      document.getElementById("cat-count").textContent =
        sorted.length ? `${sorted.length} ${sorted.length === 1 ? "categoría" : "categorías"}` : "";

      if (!sorted.length) {
        el.innerHTML = !hasBudget
          ? `<li class="empty-state"><p>Crea el presupuesto del mes para ver cada categoría aquí.</p></li>`
          : `<li class="empty-state"><p>No hay categorías de este tipo en el presupuesto del mes.</p></li>`;
        return;
      }

      el.innerHTML = sorted.map(row => {
        const budgeted  = row.budgeted || 0;
        const actual    = row.actual   || 0;
        const avail     = Math.max(budgeted - actual, 0);
        const isOver    = actual > budgeted && budgeted > 0;
        const pct       = row.pct !== null ? Math.round((row.pct||0)*100) : 0;
        const barW      = Math.min(row.pct||0, 1) * 100;
        const noSpend   = actual === 0;
        const fillCls   = isOver ? "over" : pct >= 80 ? "warn" : "";

        let right;
        if (isOver)       right = `<span class="num row-meta over">Excedido ${money(actual - budgeted)}</span>`;
        else if (noSpend) right = `<span class="row-meta">Sin gastos</span>`;
        else if (!avail)  right = `<span class="row-meta">Completo</span>`;
        else              right = `<span class="num row-meta">Quedan ${money(avail)}</span>`;

        return `
          <li class="row">
            <div class="row-line">
              <span class="row-name">${esc(formatName(row.category))}</span>
              <span class="num row-amt ${noSpend ? "zero" : ""}">${money(actual)}</span>
            </div>
            <div class="progress-bar" role="img" aria-label="${pct}% usado">
              <div class="progress-fill ${fillCls}" style="width:${barW}%;"></div>
            </div>
            <div class="row-line">
              <span class="num row-meta">de ${money(budgeted)} · ${pct}%</span>
              ${right}
            </div>
          </li>`;
      }).join("");
    }

    // Filtros
    document.getElementById("filters").addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      document.querySelectorAll("#filters .chip").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      renderList();
    });
  </script>
</body>
</html>
