<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Presupuesto · Inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../assets/style.css"/>
  <style>
    /* ── Layout ─────────────────────────────────────────── */
    .dash-page {
      max-width: 680px; margin: 0 auto;
      padding: 20px 20px 0;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Toprow (mes + asistente) ────────────────────────── */
    .dash-toprow {
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-asst-btn {
      width: 44px; height: 44px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--accent); display: flex; align-items: center; justify-content: center;
      text-decoration: none; flex-shrink: 0;
      transition: border-color 0.2s;
    }
    .dash-asst-btn:hover { border-color: var(--accent); }

    /* ── Tarjeta anillo ──────────────────────────────────── */
    .dash-ring-card {
      display: flex; align-items: center; gap: 18px;
      border-radius: 24px;
    }
    .ring-text {
      display: flex; flex-direction: column; gap: 4px;
      flex: 1; min-width: 0;
    }
    .ring-lbl  { font-size: 13px; font-weight: 600; color: var(--muted); }
    .ring-amt  {
      font-family: "Sora", sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text); line-height: 1.1;
    }
    .ring-sub  { font-size: 13px; color: var(--muted); }
    .health-badge {
      display: inline-block; margin-top: 6px;
      font-size: 12px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px;
    }
    .health-badge.ok   { background: var(--income-soft); color: var(--income); }
    .health-badge.warn { background: rgba(199,106,18,0.12); color: var(--warning-text); }

    /* ── Mini tarjetas (ingresos + gastos) ───────────────── */
    .dash-mini-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .dash-mini-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .dash-mini-ico {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .dash-mini-lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
    .dash-mini-val {
      font-family: "Sora", sans-serif; font-size: 19px; font-weight: 700;
      color: var(--text);
    }

    /* ── Encabezado de sección ───────────────────────────── */
    .dash-sect-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .dash-sect-title {
      font-family: "Sora", sans-serif; font-size: 18px; font-weight: 600;
      color: var(--text); letter-spacing: -0.02em;
    }
    .dash-link {
      font-size: 14px; font-weight: 600;
      color: var(--accent); text-decoration: none;
    }
    .dash-link:hover { color: var(--accent-strong); }

    /* ── Cuadrícula de categorías ────────────────────────── */
    .cats-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-top: 10px;
    }
    .cat-card-new {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .cat-card-hdr {
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .cat-card-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .cat-card-pct  { font-size: 14px; font-weight: 700; color: var(--muted); }
    .cat-card-pct.over { color: var(--warning-text); }
    .cat-card-sub  { font-size: 13px; color: var(--muted); }
    .cat-bar-track {
      height: 6px; background: var(--surface2);
      border-radius: 999px; overflow: hidden; margin-top: 2px;
    }
    .cat-bar-fill {
      height: 100%; border-radius: 999px; background: var(--accent);
      transition: width 0.6s ease;
    }
    .cat-bar-fill.over { background: var(--warning); }

    /* ── Solo escritorio (ocultos en móvil) ──────────────── */
    .dash-desktop-hdr,
    .dash-kpis,
    .dash-recent-sect { display: none; }

    /* ── Escritorio ≥ 900px ──────────────────────────────── */
    @media (min-width: 900px) {
      .dash-page       { max-width: 100%; padding: 28px 32px; gap: 20px; }
      .dash-toprow,
      .dash-ring-card,
      .dash-mini-row   { display: none !important; }

      .dash-desktop-hdr {
        display: flex; align-items: center; justify-content: space-between;
        flex-wrap: wrap; gap: 12px;
      }
      .dash-desktop-title {
        font-family: "Sora", sans-serif; font-size: 28px; font-weight: 700;
        letter-spacing: -0.02em; color: var(--text); margin: 0;
      }
      .dash-desktop-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .dash-new-btn {
        height: 44px; padding: 0 18px; border-radius: 12px; border: none;
        background: var(--accent); color: #FFFFFF;
        font-family: "Public Sans", sans-serif; font-size: 15px; font-weight: 700;
        cursor: pointer; text-decoration: none; white-space: nowrap;
        display: flex; align-items: center; transition: background 0.2s;
      }
      .dash-new-btn:hover { background: var(--accent-strong); }

      .dash-kpis { display: flex; flex-wrap: wrap; gap: 14px; }
      .dash-kpi-card {
        flex: 1 1 180px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 18px; padding: 16px 18px;
      }
      .dash-kpi-lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
      .dash-kpi-val {
        font-family: "Sora", sans-serif; font-size: 24px; font-weight: 700;
        margin-top: 4px;
      }
      .dash-kpi-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

      .dash-main-row {
        display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;
      }
      .dash-cats-sect {
        flex: 1 1 300px;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 20px; padding: 20px;
      }
      .dash-cats-sect .cats-grid-2 { grid-template-columns: 1fr; gap: 0; margin-top: 12px; }
      .dash-cats-sect .cat-card-new {
        border-radius: 0; border: none;
        border-bottom: 1px solid var(--border-soft);
        padding: 12px 0;
      }
      .dash-cats-sect .cat-card-new:last-child { border-bottom: none; }

      .dash-recent-sect {
        display: flex; flex-direction: column;
        flex: 2 1 420px; min-width: 0;
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 20px; padding: 20px; gap: 10px;
      }
      .recent-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .recent-table thead tr {
        text-align: left; color: var(--muted);
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
      }
      .recent-table th { padding: 8px 8px 8px 0; font-weight: 700; }
      .recent-table th:last-child { text-align: right; padding: 8px 0; }
      .recent-table td {
        padding: 11px 8px 11px 0;
        border-top: 1px solid var(--border-soft);
      }
      .recent-table td:last-child { text-align: right; font-weight: 700; padding: 11px 0; }
      .recent-cat-chip {
        background: var(--surface2); color: var(--accent);
        font-size: 12px; font-weight: 600;
        padding: 3px 8px; border-radius: 999px; white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <div class="dash-page">

    <!-- Móvil: selector de mes + botón asistente -->
    <div class="dash-toprow">
      <div id="month-selector-container"></div>
      <a href="./asistente.html" class="dash-asst-btn" aria-label="Asistente">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      </a>
    </div>

    <!-- Móvil: tarjeta principal con anillo -->
    <div class="card dash-ring-card" id="main-card">
      <div class="skeleton" style="width:110px;height:110px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
        <div class="skeleton" style="height:13px;width:55%;border-radius:6px;"></div>
        <div class="skeleton" style="height:28px;width:85%;border-radius:6px;"></div>
        <div class="skeleton" style="height:13px;width:70%;border-radius:6px;"></div>
      </div>
    </div>

    <!-- Móvil: tarjetas ingresos + gastos -->
    <div class="dash-mini-row" id="dash-mini-row">
      <div class="skeleton" style="height:90px;border-radius:18px;"></div>
      <div class="skeleton" style="height:90px;border-radius:18px;"></div>
    </div>

    <!-- Escritorio: título + acciones -->
    <div class="dash-desktop-hdr">
      <h1 class="dash-desktop-title" id="dash-title">Cargando...</h1>
      <div class="dash-desktop-actions">
        <a href="./expenses.html" class="dash-new-btn">+ Nuevo movimiento</a>
      </div>
    </div>

    <!-- Escritorio: 4 indicadores KPI -->
    <div class="dash-kpis" id="dash-kpis">
      <div class="dash-kpi-card skeleton" style="height:80px;"></div>
      <div class="dash-kpi-card skeleton" style="height:80px;"></div>
      <div class="dash-kpi-card skeleton" style="height:80px;"></div>
      <div class="dash-kpi-card skeleton" style="height:80px;"></div>
    </div>

    <!-- Compartido: categorías (+ movimientos recientes en escritorio) -->
    <div class="dash-main-row">
      <section class="dash-cats-sect">
        <div class="dash-sect-hdr">
          <span class="dash-sect-title">Categorías</span>
          <a href="./comparison.html" class="dash-link">Comparativo</a>
        </div>
        <div class="cats-grid-2" id="cats-grid">
          <div class="skeleton" style="height:100px;border-radius:18px;"></div>
          <div class="skeleton" style="height:100px;border-radius:18px;"></div>
          <div class="skeleton" style="height:100px;border-radius:18px;"></div>
          <div class="skeleton" style="height:100px;border-radius:18px;"></div>
        </div>
      </section>

      <section class="dash-recent-sect" id="dash-recent-sect">
        <div class="dash-sect-hdr">
          <span class="dash-sect-title">Movimientos recientes</span>
          <a href="./expenses.html" class="dash-link">Ver todos</a>
        </div>
        <div id="recent-list">
          <div class="skeleton" style="height:200px;border-radius:8px;margin-top:10px;"></div>
        </div>
      </section>
    </div>

  </div>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <script type="module">
    import { requireAuth } from "../modules/auth.js";
    import { getExpenses, getBudget, getWallets, getIncomes } from "../modules/db.js";
    import { renderBottomNav, renderMonthSelector } from "../assets/ui.js";
    import { formatCOP, currentMonth, formatMonth, sumByCategory, buildComparison, formatName } from "../assets/utils.js";

    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

    let uid, selectedMonth;
    const user = await requireAuth();
    uid = user.uid;
    selectedMonth = currentMonth();

    renderBottomNav("dashboard");

    renderMonthSelector("month-selector-container", selectedMonth, m => {
      selectedMonth = m;
      loadDashboard();
    });

    function updateTitle() {
      const el = document.getElementById("dash-title");
      if (el) el.textContent = "Resumen de " + formatMonth(selectedMonth);
    }
    updateTitle();

    await loadDashboard();

    async function loadDashboard() {
      updateTitle();
      const [expenses, budget, incomes, wallets] = await Promise.all([
        getExpenses(uid, { month: selectedMonth }),
        getBudget(uid, selectedMonth),
        getIncomes(uid, { month: selectedMonth }),
        getWallets(uid)
      ]);

      const totalBudgeted = budget
        ? Object.values(budget.categories || {}).reduce((s, v) => s + Number(v), 0)
        : 0;
      const totalSpent  = expenses.reduce((s, e) => s + Number(e.amount), 0);
      const totalIncome = incomes.filter(i => !i.isProportional).reduce((s, i) => s + Number(i.amount), 0);
      const saldo = totalBudgeted - totalSpent;
      const pct   = totalBudgeted > 0 ? totalSpent / totalBudgeted : 0;

      const walletMap = Object.fromEntries(wallets.map(w => [w.id, formatName(w.name) || w.id]));

      renderMainCard(saldo, pct, totalBudgeted);
      renderMiniStats(totalIncome, totalSpent);
      renderDesktopKPIs(saldo, totalIncome, totalSpent, totalBudgeted, pct, expenses.length);
      renderCatsGrid(expenses, budget);
      renderRecentMovements(expenses, walletMap);
    }

    // ── Tarjeta anillo (móvil) ────────────────────────────
    function renderMainCard(saldo, pct, totalBudgeted) {
      const isDark        = document.body.classList.contains("dark");
      const circumference = 2 * Math.PI * 54;
      const dash          = Math.min(pct, 1) * circumference;
      const pctN          = Math.round(pct * 100);

      const trackColor    = isDark ? "#1B2640" : "#E6EBF5";
      const textFill      = isDark ? "#E9EEF6" : "#0E1726";
      const subFill       = isDark ? "#9AA7BC" : "#556274";
      const progressColor = pct >= 0.8
        ? (isDark ? "#F0A35A" : "#C76A12")
        : (isDark ? "#6F8BFF" : "#2346D1");

      const healthText  = pct >= 1 ? "Presupuesto excedido" : pct >= 0.8 ? "Revisa el ritmo" : "Ritmo saludable";
      const healthClass = pct >= 0.8 ? "warn" : "ok";

      document.getElementById("main-card").innerHTML = `
        <svg width="110" height="110" viewBox="0 0 128 128"
             role="img" aria-label="${pctN}% del presupuesto usado"
             style="flex-shrink:0;">
          <circle cx="64" cy="64" r="54" fill="none"
            stroke="${trackColor}" stroke-width="14"/>
          <circle cx="64" cy="64" r="54" fill="none"
            stroke="${progressColor}" stroke-width="14"
            stroke-linecap="round"
            stroke-dasharray="${dash.toFixed(1)} ${circumference.toFixed(1)}"
            transform="rotate(-90 64 64)"/>
          <text x="64" y="61" text-anchor="middle"
            font-family="Sora,sans-serif" font-size="26" font-weight="700"
            fill="${textFill}">${pctN}%</text>
          <text x="64" y="79" text-anchor="middle"
            font-family="Public Sans,sans-serif" font-size="12" font-weight="600"
            fill="${subFill}">usado</text>
        </svg>
        <div class="ring-text">
          <span class="ring-lbl">Te queda disponible</span>
          <span class="ring-amt">${formatCOP(Math.abs(saldo))}</span>
          ${totalBudgeted > 0
            ? `<span class="ring-sub">de ${formatCOP(totalBudgeted)} presupuestados</span>`
            : ""}
          <span class="health-badge ${healthClass}">${healthText}</span>
        </div>
      `;
    }

    // ── Tarjetas mini ingresos / gastos (móvil) ───────────
    function renderMiniStats(totalIncome, totalSpent) {
      document.getElementById("dash-mini-row").innerHTML = `
        <div class="dash-mini-card">
          <div class="dash-mini-ico" style="background:var(--income-soft);color:var(--income);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </div>
          <span class="dash-mini-lbl">Ingresos</span>
          <span class="dash-mini-val">${formatCOP(totalIncome)}</span>
        </div>
        <div class="dash-mini-card">
          <div class="dash-mini-ico" style="background:var(--surface2);color:var(--accent);">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </div>
          <span class="dash-mini-lbl">Gastos</span>
          <span class="dash-mini-val">${formatCOP(totalSpent)}</span>
        </div>
      `;
    }

    // ── 4 indicadores KPI (escritorio) ───────────────────
    function renderDesktopKPIs(saldo, totalIncome, totalSpent, totalBudgeted, pct, count) {
      const pctN = Math.round(pct * 100);
      const kpis = [
        { label: "Disponible",  value: formatCOP(saldo),         sub: `${pctN}% del presupuesto`, color: "var(--accent)" },
        { label: "Ingresos",    value: formatCOP(totalIncome),   sub: "este mes",                 color: "var(--income)" },
        { label: "Gastos",      value: formatCOP(totalSpent),    sub: `${count} registros`,       color: "var(--text)"   },
        { label: "Presupuesto", value: formatCOP(totalBudgeted), sub: `${pctN}% usado`,           color: "var(--text)"   }
      ];
      document.getElementById("dash-kpis").innerHTML = kpis.map(k => `
        <div class="dash-kpi-card">
          <div class="dash-kpi-lbl">${k.label}</div>
          <div class="dash-kpi-val" style="color:${k.color};">${k.value}</div>
          <div class="dash-kpi-sub">${k.sub}</div>
        </div>
      `).join("");
    }

    // ── Cuadrícula de categorías ──────────────────────────
    function renderCatsGrid(expenses, budget) {
      const el = document.getElementById("cats-grid");
      if (!budget?.categories) {
        el.innerHTML = `
          <div style="grid-column:1/-1;" class="empty-state">
            <p>Configura tu presupuesto para ver las categorías.</p>
            <a href="./budget.html" style="font-size:13px;color:var(--accent);display:inline-block;margin-top:8px;">
              Ir a presupuesto →
            </a>
          </div>`;
        return;
      }
      const actual     = sumByCategory(expenses);
      const comparison = buildComparison(budget.categories, actual)
        .filter(r => r.budgeted > 0)
        .sort((a, b) => (b.pct || 0) - (a.pct || 0));

      if (!comparison.length) {
        el.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Sin categorías configuradas.</div>`;
        return;
      }
      el.innerHTML = comparison.map(row => {
        const pctN   = row.pct !== null ? Math.round(row.pct * 100) : 0;
        const isOver = pctN >= 100;
        const barW   = Math.min(pctN, 100);
        return `
          <div class="cat-card-new">
            <div class="cat-card-hdr">
              <span class="cat-card-name">${formatName(row.category)}</span>
              <span class="cat-card-pct ${isOver ? "over" : ""}">${pctN}%</span>
            </div>
            <span class="cat-card-sub">${formatCOP(row.actual)} de ${formatCOP(row.budgeted)}</span>
            <div class="cat-bar-track">
              <div class="cat-bar-fill ${isOver ? "over" : ""}" style="width:${barW}%;"></div>
            </div>
          </div>`;
      }).join("");
    }

    // ── Movimientos recientes (escritorio) ────────────────
    function renderRecentMovements(expenses, walletMap) {
      const el = document.getElementById("recent-list");
      const recent = [...expenses]
        .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
        .slice(0, 6);

      if (!recent.length) {
        el.innerHTML = `<div class="empty-state" style="margin-top:10px;"><p>Sin movimientos este mes.</p></div>`;
        return;
      }
      const fmtDate = d => {
        if (!d) return "—";
        const [y, m, day] = d.split("-");
        return new Date(+y, +m - 1, +day).toLocaleDateString("es-CO", { day: "numeric", month: "short" });
      };
      el.innerHTML = `
        <table class="recent-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Descripción</th>
              <th>Categoría</th>
              <th>Cajita</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody>
            ${recent.map(e => `
              <tr>
                <td style="color:var(--muted);">${fmtDate(e.date)}</td>
                <td style="font-weight:600;">${formatName(e.description || e.category) || "—"}</td>
                <td><span class="recent-cat-chip">${formatName(e.category) || "—"}</span></td>
                <td style="color:var(--muted);">${walletMap[e.walletId] || "—"}</td>
                <td>− ${formatCOP(Number(e.amount))}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }
  </script>
</body>
</html>
