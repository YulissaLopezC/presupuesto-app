<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presupuesto · Extracto</title>
  <link rel="stylesheet" href="../assets/style.css?v=20261018"/>
  <style>
    /* ── Página ──────────────────────────────────────────── */
    .ext-page {
      max-width: 680px; margin: 0 auto;
      padding: 16px 20px 24px;
      display: flex; flex-direction: column; gap: 14px;
    }

    /* ── Encabezado (celular) ────────────────────────────── */
    .ext-hdr { display: flex; align-items: center; gap: 10px; }
    .ext-circle {
      width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      text-decoration: none;
    }
    .ext-circle:hover { border-color: var(--accent); color: var(--accent); }
    .ext-hdr-mid { flex-grow: 1; min-width: 0; position: relative; }
    .ext-kicker {
      display: block; font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .ext-wallet-name {
      display: flex; align-items: center; gap: 6px;
      font-family: "Sora", sans-serif; font-size: 22px; font-weight: 700; color: var(--text);
    }
    .ext-wallet-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ext-wallet-name svg { flex-shrink: 0; }
    /* El select nativo cubre el nombre: tocarlo abre el selector del sistema */
    .ext-wallet-overlay {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      font-size: 16px; width: 100%;
    }
    .ext-export-wrap { position: relative; }
    .ext-export-menu {
      position: absolute; right: 0; top: 50px; z-index: 50;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: 0 4px 16px rgba(14,23,38,0.12); min-width: 180px; overflow: hidden;
    }
    .ext-export-menu button {
      width: 100%; height: 44px; border: none; background: transparent; padding: 0 14px;
      text-align: left; font-family: inherit; font-size: 14px; color: var(--text); cursor: pointer;
    }
    .ext-export-menu button:hover { background: var(--bg); }

    /* ── Selector de mes (celular) ───────────────────────── */
    .ext-month {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; height: 44px; padding: 0 4px;
    }
    .ext-month button {
      width: 40px; height: 40px; border: none; background: transparent; color: var(--muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 10px;
    }
    .ext-month button:disabled { opacity: 0.3; cursor: not-allowed; }
    .ext-month-lbl { font-size: 15px; font-weight: 600; color: var(--text); }

    /* ── Tarjeta navy (celular) ──────────────────────────── */
    .ext-card {
      background: var(--navy); color: #fff; border-radius: 20px; padding: 16px 18px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .ext-card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .ext-card-lbl { font-size: 12px; color: var(--navy-muted); }
    .ext-card-val { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ext-card-val.in { color: #6EDDB6; }
    .ext-card-sep { height: 1px; background: var(--navy-2); }
    .ext-card-final { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .ext-card-final-lbl { font-size: 14px; color: var(--navy-muted); }
    .ext-card-final-val { font-family: "Sora", sans-serif; font-size: 26px; font-weight: 700; }

    /* ── Aviso de diferencias ────────────────────────────── */
    .ext-warn {
      font-size: 13px; color: var(--warning-text); background: rgba(199,106,18,0.08);
      border-radius: 12px; padding: 8px 12px;
    }

    /* ── Chips de filtro ─────────────────────────────────── */
    .ext-chips { display: flex; gap: 8px; }
    .ext-chip {
      height: 36px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .ext-chip.active { background: var(--text); border-color: var(--text); color: var(--surface); }

    /* ── Lista por día (celular) ─────────────────────────── */
    .ext-list {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 14px 4px;
    }
    .ext-day + .ext-day { margin-top: 28px; }
    .ext-day-hdr {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .ext-item {
      display: flex; align-items: center; gap: 12px; padding: 9px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .ext-item:last-child { border-bottom: none; }
    .ext-ico {
      width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .ext-info { flex-grow: 1; min-width: 0; }
    .ext-desc { font-size: 14px; font-weight: 600; color: var(--text); }
    .ext-kind { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ext-right { text-align: right; flex-shrink: 0; }
    .ext-amt { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .ext-amt.in { color: var(--income); }
    .ext-amt.none { color: var(--muted); font-weight: 600; }
    .ext-bal { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ext-empty { padding: 24px 8px 28px; text-align: center; font-size: 14px; color: var(--muted); }

    /* Colores por tipo */
    .k-ingreso  { background: var(--income-soft); color: var(--income); }
    .k-gasto    { background: var(--surface2); color: var(--accent); }
    .k-transfer, .k-pago, .k-prestamo, .k-abono { background: var(--border-soft); color: var(--muted); }
    .k-ahorro   { background: #E9F2E1; color: #3F7D1E; }
    .k-ajuste   { background: #FBEEDF; color: var(--warning-text); }
    body.dark .k-ahorro { background: #1E2B16; color: #8CC46A; }
    body.dark .k-ajuste { background: #33230F; }
    @media (prefers-color-scheme: dark) {
      .k-ahorro { background: #1E2B16; color: #8CC46A; }
      .k-ajuste { background: #33230F; }
    }

    /* ── Escritorio ──────────────────────────────────────── */
    .ext-desk { display: none; }
    .ext-crumb { font-size: 14px; color: var(--muted); }
    .ext-crumb a { color: var(--accent); font-weight: 600; text-decoration: none; }
    .ext-desk-bar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    }
    .ext-desk-left { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .ext-desk-title {
      font-family: "Sora", sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text);
    }
    .ext-pill-select {
      height: 40px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); padding: 0 14px; font-family: inherit;
      font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
    }
    .ext-desk-actions { display: flex; gap: 10px; }
    .ext-btn {
      height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); font-family: inherit;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .ext-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .ext-btn.primary:hover { background: var(--accent-strong); }
    .ext-kpis { display: flex; flex-wrap: wrap; gap: 14px; }
    .ext-kpi {
      flex: 1 1 160px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 16px 18px;
    }
    .ext-kpi-lbl { font-size: 13px; color: var(--muted); font-weight: 600; }
    .ext-kpi-val { font-family: "Sora", sans-serif; font-size: 22px; font-weight: 700; color: var(--text); }
    .ext-kpi-val.in { color: var(--income); }
    .ext-kpi.navy { background: var(--navy); border-color: var(--navy); }
    .ext-kpi.navy .ext-kpi-lbl { color: var(--navy-muted); }
    .ext-kpi.navy .ext-kpi-val { color: #fff; }

    .ext-table-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 8px 20px 12px;
    }
    .ext-table-scroll { overflow-x: auto; }
    .ext-table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; color: var(--text); }
    .ext-table th {
      text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.05em; font-weight: 700; padding: 12px 8px 10px;
    }
    .ext-table td { padding: 11px 8px; border-top: 1px solid var(--border-soft); vertical-align: top; }
    .ext-table th:first-child, .ext-table td:first-child { padding-left: 0; }
    .ext-table th:last-child,  .ext-table td:last-child  { padding-right: 0; }
    .ext-table .num { text-align: right; white-space: nowrap; }
    .ext-table .date { color: var(--muted); white-space: nowrap; }
    .ext-table .desc { font-weight: 600; }
    .ext-table .in  { color: var(--income); font-weight: 700; }
    .ext-table .out { font-weight: 700; }
    .ext-table .muted { color: var(--muted); }
    .ext-table .bal { color: var(--muted); }
    .ext-table tr.ext-open td { background: var(--bg); border-top-color: var(--border); font-weight: 700; }
    .ext-table tr.ext-close td { border-top: 2px solid var(--text); font-weight: 700; padding-top: 12px; padding-bottom: 12px; }
    .ext-table tr.ext-close .bal { color: var(--text); font-family: "Sora", sans-serif; font-size: 16px; }
    .ext-pill {
      font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    }

    /* ── Estado de carga / error ─────────────────────────── */
    .ext-status { display: none; }
    .is-loading .ext-status, .is-error .ext-status {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      padding: 32px 16px; text-align: center; font-size: 14px; color: var(--muted);
    }
    .is-error .ext-status { color: var(--text); font-weight: 600; }
    .is-loading .ext-data, .is-error .ext-data { display: none !important; }
    .ext-spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--surface2); border-top-color: var(--accent);
      animation: ext-spin 0.7s linear infinite;
    }
    @keyframes ext-spin { to { transform: rotate(360deg); } }

    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* Encabezado solo para imprimir */
    .ext-print-hdr { display: none; }

    @media (min-width: 900px) {
      .ext-page { max-width: none; padding: 28px 32px 40px; gap: 20px; }
      .ext-mob { display: none !important; }
      .ext-desk { display: flex; flex-direction: column; gap: 20px; }
      .ext-crumb + .ext-desk-bar { margin-top: -10px; }
    }

    /* ── PDF (window.print) ──────────────────────────────── */
    @media print {
      @page { margin: 14mm; }
      body { background: #fff !important; padding: 0 !important; color: #000; }
      .bottom-nav, #sidebar, #topbar, .topbar, .ext-mob, .ext-crumb, .ext-desk-bar, .ext-kpis, .ext-warn { display: none !important; }
      .ext-page { max-width: none; padding: 0; }
      .ext-desk { display: block !important; }
      .ext-print-hdr { display: block; margin-bottom: 14px; }
      .ext-print-hdr h1 { font-family: "Sora", sans-serif; font-size: 20px; margin: 0 0 2px; }
      .ext-print-hdr p { font-size: 12px; margin: 2px 0; color: #333; }
      .ext-table-card { border: none; padding: 0; }
      .ext-table { min-width: 0; font-size: 11px; }
      .ext-table td, .ext-table th { padding: 6px 6px; }
      .ext-pill { background: none !important; padding: 0; color: #000 !important; font-size: inherit; }
      tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="ext-page is-loading">

    <!-- ── Celular ── -->
    <div class="ext-hdr ext-mob">

    <div class="ext-chips ext-mob ext-data" role="tablist" aria-label="Filtrar movimientos" id="mob-chips">

      <div class="ext-desk-bar">

          <h1 class="ext-desk-title">Extracto</h1>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Estado de carga con límite de 15 s. Es un script clásico a propósito:
       si el módulo de abajo falla al cargar (archivo viejo en caché, error de
       red) igual se muestra el error con "Reintentar" en vez de cargar sin fin. -->
  <script>
    (function () {
      var LIMIT_MS = 15000, timer = null;
      window.extStatus = function (state, opts) {
        var page  = document.querySelector(".ext-page");
        var box   = document.getElementById("ext-status");
        var retry = opts && opts.retry;
        clearTimeout(timer);
        page.classList.remove("is-loading", "is-error");
        if (state === "loading") {
          page.classList.add("is-loading");
          box.innerHTML = '<span class="ext-spinner" aria-hidden="true"></span><span>Cargando extracto…</span>';
          timer = setTimeout(function () {
            console.error("[extracto] La carga no terminó en " + LIMIT_MS / 1000 + " s");
            window.extStatus("error", { retry: retry });
          }, LIMIT_MS);
        } else if (state === "error") {
          page.classList.add("is-error");
          box.innerHTML = '<span>No se pudo cargar el extracto</span>' +
            '<button type="button" class="ext-btn primary" id="ext-retry">Reintentar</button>';
          document.getElementById("ext-retry").onclick = function () {
            if (retry) retry(); else location.reload();
          };
        } else {
          box.innerHTML = "";
        }
      };
      window.extStatus("loading");
    })();
  </script>

  <script type="module">
    import { requireAuth } from "../modules/auth.js?v=20261018";
    import { getWallets, getWalletStatementSources, getWalletHistorySources } from "../modules/db.js?v=20261018";
    import { renderBottomNav } from "../assets/ui.js?v=20261018";
    import { formatCOP, formatMonth, currentMonth, today, lastMonths, formatName } from "../assets/utils.js?v=20261018";
    import { buildEvents, buildStatement, creditUnexplained, statementToCSV, KIND_LABEL, ALL_WALLETS } from "../assets/statement.js?v=20261018";

    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

    const ICON = {
      ingreso:  "M12 19V5M5 12l7-7 7 7",
      abono:    "M12 19V5M5 12l7-7 7 7",
      gasto:    "M12 5v14M5 12l7 7 7-7",
      prestamo: "M12 5v14M5 12l7 7 7-7",
      transfer: "M4 8h14l-4-4M20 16H6l4 4",
      pago:     "M4 8h14l-4-4M20 16H6l4 4",
      ahorro:   "M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10",
      ajuste:   "M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4"
    };

    const params = new URLSearchParams(location.search);
    let selectedWallet = params.get("wallet") || "";
    let selectedMonth  = /^\d{4}-\d{2}$/.test(params.get("month") || "") ? params.get("month") : currentMonth();
    let filter = "all";
    let wallets = [], active = [], events = [], st = null;
    let uid = null;
    let loadedFrom = null;          // "YYYY-MM": los datos cubren desde ese mes hasta hoy
    let loadSeq = 0;                // descarta respuestas de cargas anteriores
    const creditCheck = new Map();  // walletId → diferencia sin explicar (historial completo)

    // Carga los movimientos desde el día 1 del mes elegido. Cualquier error
    // (red, permisos, al dibujar) se muestra en pantalla y en consola.
    async function load() {
      const seq = ++loadSeq;
      window.extStatus("loading", { retry: load });
      document.getElementById("mob-month-lbl").textContent = monthLabel(selectedMonth);
      try {
        if (!uid) {
          const user = await requireAuth();
          uid = user.uid;
          renderBottomNav("wallets");
        }
        const from = selectedMonth;
        const [ws, sources] = await Promise.all([
          getWallets(uid, true),
          getWalletStatementSources(uid, `${from}-01`)
        ]);
        if (seq !== loadSeq) return;
        wallets = ws;
        active  = wallets.filter(w => !w.archived);
        events  = buildEvents(sources, wallets);
        loadedFrom = from;
        // Una cajita archivada se puede ver si llega por URL, pero no aparece en el selector
        if (selectedWallet !== ALL_WALLETS && !wallets.some(w => w.id === selectedWallet)) {
          selectedWallet = active[0]?.id || ALL_WALLETS;
        }
        populateSelectors();
        render();
        window.extStatus("ready");
      } catch (err) {
        if (seq !== loadSeq) return;
        console.error("[extracto] Error al cargar:", err);
        window.extStatus("error", { retry: load });
      }
    }

    // Tarjetas de crédito: verificar contra su historial completo, en segundo
    // plano y sin bloquear el extracto. Si falla, solo queda en consola.
    async function checkCredit(walletId) {
      const wallet = wallets.find(w => w.id === walletId);
      if (!wallet || wallet.type !== "credito" || creditCheck.has(walletId)) return;
      creditCheck.set(walletId, 0);
      try {
        const history = await getWalletHistorySources(uid, walletId);
        creditCheck.set(walletId, creditUnexplained(buildEvents(history, wallets), wallet));
        if (selectedWallet === walletId && st) renderWarning();
      } catch (err) {
        creditCheck.delete(walletId);
        console.error("[extracto] No se pudo verificar la tarjeta:", err);
      }
    }

    // ── Selectores ────────────────────────────────────────
    function walletOptions() {
      const list = active.map(w => ({ id: w.id, label: formatName(w.name) }));
      const sel  = wallets.find(w => w.id === selectedWallet && w.archived);
      if (sel) list.push({ id: sel.id, label: `${formatName(sel.name)} (archivada)` });
      list.push({ id: ALL_WALLETS, label: "Todas las cajitas" });
      return list;
    }
    function populateSelectors() {
      const opts = walletOptions().map(o =>
        `<option value="${o.id}"${o.id === selectedWallet ? " selected" : ""}>${o.label}</option>`).join("");
      document.getElementById("mob-wallet").innerHTML  = opts;
      document.getElementById("desk-wallet").innerHTML = opts;
      const months = lastMonths(12);
      if (!months.includes(selectedMonth)) months.push(selectedMonth);
      months.sort().reverse();
      document.getElementById("desk-month").innerHTML = months.map(m =>
        `<option value="${m}"${m === selectedMonth ? " selected" : ""}>${monthLabel(m)}</option>`).join("");
    }
    function monthLabel(m) { return formatName(formatMonth(m)); }
    function shiftMonth(m, n) {
      const [y, mm] = m.split("-").map(Number);
      const d = new Date(y, mm - 1 + n, 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    }
    function setWallet(id) {
      selectedWallet = id;
      document.getElementById("mob-wallet").value  = id;
      document.getElementById("desk-wallet").value = id;
      syncUrl(); safeRender();
    }
    // Hacia meses posteriores los datos ya cargados alcanzan; hacia atrás
    // hay que recargar desde el día 1 del nuevo mes.
    function setMonth(m) {
      selectedMonth = m;
      populateSelectors();
      syncUrl();
      if (!loadedFrom || m < loadedFrom) load();
      else safeRender();
    }
    function safeRender() {
      try { render(); }
      catch (err) {
        console.error("[extracto] Error al mostrar:", err);
        window.extStatus("error", { retry: load });
      }
    }
    function syncUrl() {
      history.replaceState(null, "", `?wallet=${encodeURIComponent(selectedWallet)}&month=${selectedMonth}`);
    }

    document.getElementById("mob-wallet").addEventListener("change", e => setWallet(e.target.value));
    document.getElementById("desk-wallet").addEventListener("change", e => setWallet(e.target.value));
    document.getElementById("desk-month").addEventListener("change", e => setMonth(e.target.value));
    document.getElementById("mob-prev").addEventListener("click", () => setMonth(shiftMonth(selectedMonth, -1)));
    document.getElementById("mob-next").addEventListener("click", () => {
      if (selectedMonth < currentMonth()) setMonth(shiftMonth(selectedMonth, 1));
    });
    document.getElementById("mob-chips").addEventListener("click", e => {
      const chip = e.target.closest("[data-filter]"); if (!chip) return;
      filter = chip.dataset.filter;
      document.querySelectorAll("#mob-chips .ext-chip").forEach(c => {
        const on = c === chip;
        c.classList.toggle("active", on);
        c.setAttribute("aria-selected", String(on));
      });
      safeRender();
    });

    // ── Exportar ──────────────────────────────────────────
    const exportMenu = document.getElementById("mob-export-menu");
    const exportBtn  = document.getElementById("mob-export");
    exportBtn.addEventListener("click", e => {
      e.stopPropagation();
      const open = exportMenu.style.display === "none";
      exportMenu.style.display = open ? "block" : "none";
      exportBtn.setAttribute("aria-expanded", String(open));
    });
    document.addEventListener("click", () => {
      exportMenu.style.display = "none";
      exportBtn.setAttribute("aria-expanded", "false");
    });
    document.querySelectorAll("[data-export]").forEach(btn => btn.addEventListener("click", () => {
      if (btn.dataset.export === "csv") exportCSV(); else window.print();
    }));

    function currentWalletName() {
      if (selectedWallet === ALL_WALLETS) return "Todas las cajitas";
      return formatName(wallets.find(w => w.id === selectedWallet)?.name || "Cajita");
    }
    function exportCSV() {
      if (!st) return;
      const csv  = statementToCSV(st, { walletName: currentWalletName(), month: selectedMonth, showWallet: selectedWallet === ALL_WALLETS });
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      const slug = currentWalletName().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase();
      a.href = url; a.download = `extracto-${slug}-${selectedMonth}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── Render ────────────────────────────────────────────
    function render() {
      st = buildStatement(events, wallets, selectedWallet, selectedMonth);
      document.getElementById("mob-wallet-name").textContent = currentWalletName();
      document.getElementById("mob-month-lbl").textContent   = monthLabel(selectedMonth);
      document.getElementById("mob-next").disabled = selectedMonth >= currentMonth();
      document.title = `Presupuesto · Extracto ${currentWalletName()}`;

      renderWarning();
      checkCredit(selectedWallet);

      renderMobileCard();
      renderList();
      renderDesktop();
    }

    function renderWarning() {
      const diff = st.unexplained + (st.isCredit ? (creditCheck.get(selectedWallet) || 0) : 0);
      document.querySelectorAll("[data-warn]").forEach(warn => {
        if (diff !== 0) {
          warn.textContent = `Hay diferencias sin explicar de ${formatCOP(Math.abs(diff))}`;
          warn.style.display = "";
        } else warn.style.display = "none";
      });
    }

    // Etiquetas según tipo de extracto
    function labels() {
      if (st.isCredit) return { start: "Deuda inicial", end: "Deuda final", row: "Deuda" };
      if (selectedWallet === ALL_WALLETS) return { start: "Disponible inicial", end: "Disponible final", row: "Disponible" };
      return { start: "Saldo inicial", end: "Saldo final", row: "Saldo" };
    }

    function renderMobileCard() {
      const L = labels();
      document.getElementById("mob-card").innerHTML = `
        <div class="ext-card-grid">
          <div><div class="ext-card-lbl">${L.start}</div><div class="ext-card-val">${formatCOP(st.initial)}</div></div>
          <div><div class="ext-card-lbl">Entradas</div><div class="ext-card-val in">+ ${formatCOP(st.totalIn)}</div></div>
          <div><div class="ext-card-lbl">Salidas</div><div class="ext-card-val">− ${formatCOP(st.totalOut)}</div></div>
        </div>
        <div class="ext-card-sep"></div>
        <div class="ext-card-final">
          <span class="ext-card-final-lbl">${L.end}</span>
          <span class="ext-card-final-val">${formatCOP(st.final)}</span>
        </div>`;
    }

    function amountText(r) {
      if (r.dir === "in")  return `+ ${formatCOP(r.value)}`;
      if (r.dir === "out") return `− ${formatCOP(-r.value)}`;
      return formatCOP(r.amount);
    }
    function dayLabel(date) {
      const [y, m, d] = date.split("-").map(Number);
      const short = new Date(y, m - 1, d).toLocaleDateString("es-CO", { day: "numeric", month: "short" }).replace(".", "");
      const t = today();
      const yest = new Date(); yest.setDate(yest.getDate() - 1);
      const y2 = `${yest.getFullYear()}-${String(yest.getMonth() + 1).padStart(2, "0")}-${String(yest.getDate()).padStart(2, "0")}`;
      if (date === t)  return `Hoy, ${short}`;
      if (date === y2) return `Ayer, ${short}`;
      return short;
    }
    function shortDate(date) {
      const [y, m, d] = date.split("-").map(Number);
      return new Date(y, m - 1, d).toLocaleDateString("es-CO", { day: "numeric", month: "short" }).replace(".", "");
    }

    function renderList() {
      const el   = document.getElementById("mob-list");
      const L    = labels();
      const isAll = selectedWallet === ALL_WALLETS;
      const rows = st.rows.filter(r => filter === "all" || r.dir === filter).slice().reverse();
      if (!rows.length) {
        el.innerHTML = `<div class="ext-empty">${st.rows.length ? "No hay movimientos con este filtro." : "Sin movimientos este mes."}</div>`;
        return;
      }
      const groups = [];
      rows.forEach(r => {
        const last = groups[groups.length - 1];
        if (last && last.date === r.date) last.items.push(r);
        else groups.push({ date: r.date, items: [r] });
      });
      el.innerHTML = groups.map(g => `
        <div class="ext-day">
          <div class="ext-day-hdr">${dayLabel(g.date)}</div>
          ${g.items.map(r => `
            <div class="ext-item">
              <div class="ext-ico k-${r.kind}">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[r.kind]}"/></svg>
              </div>
              <div class="ext-info">
                <div class="ext-desc">${r.desc}</div>
                <div class="ext-kind">${isAll && r.kind !== "transfer" && r.kind !== "ahorro" && r.kind !== "pago" ? `${r.sub} · ${r.walletNames.join(", ")}` : r.sub}</div>
              </div>
              <div class="ext-right">
                <div class="ext-amt ${r.dir}">${amountText(r)}</div>
                <div class="ext-bal">${L.row} ${formatCOP(r.balance)}</div>
              </div>
            </div>`).join("")}
        </div>`).join("");
    }

    function renderDesktop() {
      const L      = labels();
      const isAll  = selectedWallet === ALL_WALLETS;
      const isNow  = selectedMonth === currentMonth();
      const [y, m] = selectedMonth.split("-").map(Number);
      const lastDay = `${selectedMonth}-${String(new Date(y, m, 0).getDate()).padStart(2, "0")}`;
      const endLbl  = isNow ? "hoy" : shortDate(lastDay);
      const plural  = n => `${n} movimiento${n === 1 ? "" : "s"}`;

      document.getElementById("desk-kpis").innerHTML = `
        <div class="ext-kpi"><div class="ext-kpi-lbl">${L.start} · ${shortDate(selectedMonth + "-01")}</div><div class="ext-kpi-val">${formatCOP(st.initial)}</div></div>
        <div class="ext-kpi"><div class="ext-kpi-lbl">Entradas · ${plural(st.countIn)}</div><div class="ext-kpi-val in">+ ${formatCOP(st.totalIn)}</div></div>
        <div class="ext-kpi"><div class="ext-kpi-lbl">Salidas · ${plural(st.countOut)}</div><div class="ext-kpi-val">− ${formatCOP(st.totalOut)}</div></div>
        <div class="ext-kpi navy"><div class="ext-kpi-lbl">${L.end} · ${endLbl}</div><div class="ext-kpi-val">${formatCOP(st.final)}</div></div>`;

      document.getElementById("print-hdr").innerHTML = `
        <h1>Extracto · ${currentWalletName()}</h1>
        <p>${monthLabel(selectedMonth)}${isAll ? " · Disponible sin tarjetas de crédito" : ""}</p>
        <p>${L.start}: ${formatCOP(st.initial)} · Entradas: ${formatCOP(st.totalIn)} (${plural(st.countIn)}) · Salidas: ${formatCOP(st.totalOut)} (${plural(st.countOut)}) · ${L.end}: ${formatCOP(st.final)}</p>`;

      const walletCol = isAll ? `<th>Cajita</th>` : "";
      const span      = isAll ? 5 : 4;
      const body = st.rows.map(r => `
        <tr>
          <td class="date">${shortDate(r.date)}</td>
          <td class="desc">${[r.desc, r.detail].filter(Boolean).join(" · ")}</td>
          <td><span class="ext-pill k-${r.kind}">${KIND_LABEL[r.kind]}</span></td>
          ${isAll ? `<td class="muted">${r.walletNames.join(" → ")}</td>` : ""}
          <td class="num in">${r.dir === "in" ? formatCOP(r.value) : ""}</td>
          <td class="num ${r.dir === "none" ? "muted" : "out"}"${r.dir === "none" ? ` title="No cambia el disponible"` : ""}>${r.dir === "out" ? formatCOP(-r.value) : r.dir === "none" ? formatCOP(r.amount) : ""}</td>
          <td class="num bal">${formatCOP(r.balance)}</td>
        </tr>`).join("");

      document.getElementById("desk-table").innerHTML = `
        <table class="ext-table">
          <thead><tr>
            <th>Fecha</th><th>Descripción</th><th>Tipo</th>${walletCol}
            <th class="num">Entrada</th><th class="num">Salida</th><th class="num">${L.row}</th>
          </tr></thead>
          <tbody>
            <tr class="ext-open">
              <td class="date">${shortDate(selectedMonth + "-01")}</td>
              <td colspan="${span}">${L.start}</td>
              <td class="num">${formatCOP(st.initial)}</td>
            </tr>
            ${body || `<tr><td></td><td colspan="${span + 1}" class="muted">Sin movimientos este mes.</td></tr>`}
            <tr class="ext-close">
              <td class="date">${isNow ? shortDate(today()) : shortDate(lastDay)}</td>
              <td colspan="${span - 2}">${L.end}</td>
              <td class="num in">${formatCOP(st.totalIn)}</td>
              <td class="num">${formatCOP(st.totalOut)}</td>
              <td class="num bal">${formatCOP(st.final)}</td>
            </tr>
          </tbody>
        </table>`;
    }

    load();
  </script>
</body>
</html>
