<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presupuesto · Ingresos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../assets/style.css?v=20261018"/>
  <style>
    /* ── Layout ─────────────────────────────────────────────
       Móvil: una columna de 680px máx.
       Escritorio (≥ 900px): resumen + devengado 5fr | fuentes + registros 7fr, gap 16px. */
    .inc {
      max-width: 680px; margin: 0 auto;
      padding: 20px 20px 0;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    }
    .inc .card { margin-bottom: 0; }
    .inc-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }

    /* ── Título + acciones ───────────────────────────────── */
    .inc-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .inc-head h1 {
      font-family: "Sora", sans-serif; font-size: 22px; font-weight: 600;
      letter-spacing: -0.02em; color: var(--text);
    }
    .inc-head-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 1 1 100%; }
    .inc-head-actions { display: flex; align-items: center; gap: 12px; }
    /* Registrar ingreso: círculo en móvil (como Cajitas), botón primario en escritorio */
    .inc-new {
      width: 44px; height: 44px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-family: "Public Sans", sans-serif;
      transition: border-color 0.2s, background 0.2s;
    }
    .inc-new:hover { border-color: var(--text); }
    .inc-new-lbl { display: none; }

    /* ── Cifras ──────────────────────────────────────────── */
    .num {
      font-family: "Sora", sans-serif; font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em; white-space: nowrap;
    }
    .num.pos { color: var(--income); }

    /* ── Resumen: recibido ───────────────────────────────── */
    .sum-amount { display: block; margin-top: 10px; }
    .sum-sub {
      font-family: "Sora", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-top: 8px;
    }
    .sum-card .progress-bar { height: 10px; margin-top: 16px; }
    .sum-finding { font-size: 15px; line-height: 1.5; color: var(--text); margin-top: 16px; }

    /* ── Encabezado de sección dentro de tarjeta ─────────── */
    .sect-hdr {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; min-height: 24px;
    }
    .sect-hdr h2 {
      font-family: "Public Sans", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sect-count { font-size: 13px; color: var(--muted); }

    /* ── Filas (igual que Inicio) ────────────────────────── */
    .rows { list-style: none; margin-top: 8px; }
    .row { padding: 14px 0; border-top: 1px solid var(--border-soft); }
    .row:first-child { border-top: none; }
    .row-line {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    }
    .row-name {
      font-size: 15px; font-weight: 600; color: var(--text);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row-amt { font-size: 16px; font-weight: 600; color: var(--text); }
    .row-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .row-type { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .row-amt.zero { color: var(--muted); }
    .row-meta {
      font-size: 13px; color: var(--muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row > .row-meta { margin-top: 4px; }
    .row .num.row-meta { font-weight: 600; }
    .row .progress-bar { margin: 10px 0 8px; }

    /* Registros: grupo por fecha + fila con acción de borrar */
    .date-group + .date-group { border-top: 1px solid var(--border-soft); }
    .date-group .label { display: block; padding-top: 14px; }
    .date-group .rows { margin-top: 0; }
    .income-item { display: flex; align-items: center; gap: 12px; }
    .income-left { flex: 1; min-width: 0; cursor: pointer; }
    .income-left:hover .row-name { text-decoration: underline; text-underline-offset: 3px; }
    .income-item .btn-danger {
      width: 36px; height: 36px; padding: 0; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── Estados ─────────────────────────────────────────── */
    .inc .empty-state { padding: 28px 12px; list-style: none; }
    .inc .empty-state p { margin-top: 0; color: var(--text); }
    .sk-line { height: 14px; }

    /* ── Hoja de registro (como la hoja de categorías de Movimientos) ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(14,23,38,0.5);
      z-index: 150; opacity: 0; pointer-events: none; visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; visibility: visible; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-radius: 20px 20px 0 0; padding: 10px 20px 28px;
      z-index: 160; transform: translateY(100%); visibility: hidden;
      transition: transform 0.3s ease, visibility 0.3s;
      max-width: 680px; margin: 0 auto; max-height: 90vh; overflow-y: auto;
    }
    .drawer.open { transform: translateY(0); visibility: visible; }
    .drawer-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 16px; }
    .drawer-title {
      font-family: "Sora", sans-serif; font-size: 18px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text); margin-bottom: 20px;
    }
    .amount-wrapper { position: relative; }
    .amount-wrapper .sym {
      position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%); font-family: "Sora", sans-serif; font-weight: 600;
      font-size: 15px; color: var(--muted); pointer-events: none;
    }
    .amount-wrapper .form-input { padding-left: 30px; font-family: "Sora", sans-serif; font-weight: 600; }
    .form-optional { text-transform: none; letter-spacing: 0; font-weight: 400; }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .drawer, .drawer-overlay, .inc-new { transition: none; }
      .skeleton { animation: none; }
    }

    /* ── Escritorio ≥ 900px ──────────────────────────────── */
    @media (min-width: 900px) {
      .inc {
        max-width: 1240px; padding: 32px;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px;
      }
      .inc-col   { gap: 16px; }
      .inc-side { align-self: start; position: sticky; top: 32px; }
      .inc-head  { grid-column: 1 / -1; flex-wrap: nowrap; }
      .inc-head-title { display: contents; }
      .inc-head h1 { font-size: 26px; margin-right: auto; }
      .inc-head-actions { order: 1; }
      .inc-new {
        order: 2; height: 44px;
        width: auto; padding: 0 18px; border: none; border-radius: 12px; gap: 6px;
        background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
      }
      .inc-new:hover { background: var(--accent-strong); }
      .inc-new-lbl { display: inline; }

      .drawer {
        top: 50%; bottom: auto; left: 50%; right: auto;
        width: 520px; max-width: calc(100vw - 32px);
        border-radius: 20px; padding: 28px;
        transform: translate(-50%, -46%); opacity: 0; pointer-events: none;
        box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        transition: transform 0.25s ease, opacity 0.25s ease, visibility 0.25s;
      }
      .drawer.open { transform: translate(-50%, -50%); opacity: 1; pointer-events: all; }
      .drawer-handle { display: none; }
    }
  </style>
</head>
<body>
  <main class="inc">

    <div class="inc-head">
      <div class="inc-head-title">
        <h1>Ingresos</h1>
        <button class="inc-new" id="fab" type="button" aria-label="Registrar ingreso">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span class="inc-new-lbl">Registrar ingreso</span>
        </button>
      </div>
      <div class="inc-head-actions">
        <div id="month-selector-container"></div>
      </div>
    </div>

    <div class="inc-col inc-side">
      <!-- Recibido vs esperado -->
      <section class="card sum-card" id="sum-card" aria-live="polite">
        <div class="skeleton sk-line" style="width:45%;"></div>
        <div class="skeleton" style="height:38px;width:60%;margin-top:12px;"></div>
        <div class="skeleton sk-line" style="width:50%;margin-top:10px;"></div>
        <div class="skeleton" style="height:10px;margin-top:22px;border-radius:999px;"></div>
      </section>

      <!-- Devengado del mes (ingresos proporcionales) -->
      <section class="card" id="devengado-section" style="display:none;">
        <div class="sect-hdr"><h2>Devengado del mes</h2></div>
        <ul class="rows" id="devengado-list"></ul>
      </section>
    </div>

    <div class="inc-col">
      <!-- Por fuente de ingreso -->
      <section class="card" id="sources-section" style="display:none;">
        <div class="sect-hdr">
          <h2>Por fuente de ingreso</h2>
          <span class="sect-count" id="sources-count"></span>
        </div>
        <ul class="rows" id="sources-list"></ul>
      </section>

      <!-- Registros del mes -->
      <section class="card">
        <div class="sect-hdr">
          <h2>Registros del mes</h2>
          <span class="sect-count" id="incomes-count"></span>
        </div>
        <div id="incomes-list">
          <ul class="rows">
            <li class="row"><div class="skeleton" style="height:40px;"></div></li>
            <li class="row"><div class="skeleton" style="height:40px;"></div></li>
          </ul>
        </div>
      </section>
    </div>

  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Hoja: nuevo / editar ingreso -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-handle"></div>
    <h2 class="drawer-title" id="drawer-title">Nuevo ingreso</h2>

    <div class="form-group">
      <label class="form-label" for="field-date">Fecha</label>
      <input type="date" class="form-input" id="field-date"/>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-source">Fuente</label>
      <input type="text" class="form-input" id="field-source"
             placeholder="Ej: Guillo, Sociedad, Freelance..." maxlength="60"
             list="sources-datalist"/>
      <datalist id="sources-datalist"></datalist>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-amount">Valor</label>
      <div class="amount-wrapper">
        <span class="sym">$</span>
        <input type="number" class="form-input" id="field-amount" placeholder="0" min="0"/>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-wallet">¿A cuál cajita entró?</label>
      <select class="form-select" id="field-wallet">
        <option value="">Sin cajita asignada</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="field-description">Descripción <span class="form-optional">(opcional)</span></label>
      <input type="text" class="form-input" id="field-description" placeholder="Nota adicional..." maxlength="100"/>
    </div>

    <button class="btn-primary" id="btn-save">Registrar ingreso</button>
  </div>

  <script type="module">
    import { requireAuth } from "../modules/auth.js?v=20261018";
    import { getIncomes, addIncome, updateIncome, deleteIncome, getWallets, getBudget, syncProportionalIncomes, getProportionalSummary } from "../modules/db.js?v=20261018";
    import { renderBottomNav, renderMonthSelector, showToast } from "../assets/ui.js?v=20261018";
    import { formatCOP, currentMonth, formatMonth, formatDate, today, applyNumericFormat, getNumericValue, formatName } from "../assets/utils.js?v=20261018";

    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

    let uid, selectedMonth, incomes = [], wallets = [], budget = null, propSummary = [], editingId = null;

    // ── Presentación: formato de cifras y textos ──────────
    // "$ 1.234" → "$1.234" (formato del DESIGN.md)
    const money     = v => formatCOP(Math.abs(v)).replace(/\s/g, "");
    const esc       = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const monthName = m => formatMonth(m).split(" ")[0];
    const typeLabels = { fijo: "Fijo", no_operacional: "No operacional", extraordinario: "Extraordinario" };
    // "2026-10-16" → "16 oct" (el año ya está en el selector de mes)
    const dayLabel  = d => d ? formatDate(d).replace(/ de \d{4}$| \d{4}$/, "").replace(".", "") : "—";

    const user = await requireAuth();
    uid = user.uid;
    selectedMonth = currentMonth();

    renderBottomNav("incomes");
    renderMonthSelector("month-selector-container", selectedMonth, m => {
      selectedMonth = m;
      loadAll();
    });

    wallets = await getWallets(uid);
    populateWalletSelect();
    applyNumericFormat(document.getElementById("field-amount"));
    await loadAll();

    // ── Event listeners ───────────────────────────────────
    document.getElementById("fab").addEventListener("click", openNewDrawer);
    document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
    document.getElementById("btn-save").addEventListener("click", saveIncome);
    document.getElementById("incomes-list").addEventListener("click", e => {
      const deleteBtn = e.target.closest(".btn-danger");
      const row       = e.target.closest(".income-left");
      if (deleteBtn) handleDelete(deleteBtn.dataset.id);
      else if (row)  openEditDrawer(row.dataset.id);
    });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    // ── Cargar todo ───────────────────────────────────────
    async function loadAll() {
      // Sincronizar proporcionales antes de cargar
      await syncProportionalIncomes(uid, selectedMonth);

      const [inc, bud, propSum] = await Promise.all([
        getIncomes(uid, { month: selectedMonth }),
        getBudget(uid, selectedMonth),
        getProportionalSummary(uid, selectedMonth)
      ]);
      incomes    = inc;
      budget     = bud;
      propSummary = propSum;
      renderDevengado(propSummary);
      renderSummary();
      renderComparison();
      renderIncomes();
      populateSourcesSuggestions();
    }

    // ── Devengado del mes ─────────────────────────────────
    function renderDevengado(summary) {
      const section = document.getElementById("devengado-section");
      const list    = document.getElementById("devengado-list");
      if (!summary.length) { section.style.display = "none"; return; }
      section.style.display = "block";

      list.innerHTML = summary.map(s => {
        const pct    = Math.min(s.pct, 1);
        return `
          <li class="row">
            <div class="row-line">
              <span class="row-name">${esc(formatName(s.name))}</span>
              <span class="num row-amt">${money(s.accruedAmount)}</span>
            </div>
            <div class="progress-bar" role="img" aria-label="${Math.round(pct * 100)}% devengado">
              <div class="progress-fill" style="width:${pct*100}%;"></div>
            </div>
            <div class="row-line">
              <span class="num row-meta">de ${money(s.totalAmount)} · ${money(s.dailyAmount)}/día</span>
              <span class="row-meta">${s.daysPassed} de ${s.daysInMonth} días</span>
            </div>
          </li>`;
      }).join("");
    }

      // Normalizar income a array [{name, amount, ...}]
      function normalizeIncome(income) {
        if (!income || typeof income !== "object") return [];
        if (Array.isArray(income)) {
          return income.filter(i => i && i.name && Number(i.amount) > 0);
        }
        return Object.entries(income)
          .filter(([k, v]) => isNaN(Number(k)) && !["month","updatedAt"].includes(k))
          .map(([name, val]) => {
            if (typeof val === "object" && val !== null) return { name, ...val };
            if (typeof val === "number") return { name, amount: val, type: "fijo", proportional: false };
            return null;
          })
          .filter(i => i && Number(i.amount) > 0);
      }
    // ── Resumen ───────────────────────────────────────────
    function renderSummary() {
      const totalReal     = incomes.reduce((s, i) => s + Number(i.amount), 0);
      const incomeArr  = normalizeIncome(budget?.income);
      const totalBudgeted = incomeArr.reduce((s, i) => s + Number(i.amount || 0), 0);

      const el    = document.getElementById("sum-card");
      const mName = monthName(selectedMonth);
      const pct   = totalBudgeted > 0 ? Math.min(totalReal / totalBudgeted, 1) : 0;
      const diff  = totalReal - totalBudgeted;

      let finding;
      if (totalBudgeted <= 0) {
        finding = totalReal > 0
          ? "No hay ingresos presupuestados este mes para comparar."
          : "Aún no hay ingresos presupuestados ni registrados este mes.";
      } else if (diff < 0) {
        finding = `Faltan <strong class="num">${money(diff)}</strong> por recibir para llegar a lo esperado.`;
      } else if (diff > 0) {
        finding = `Recibiste <strong class="num pos">${money(diff)}</strong> más de lo esperado.`;
      } else {
        finding = "Recibiste exactamente lo esperado.";
      }

      el.innerHTML = `
        <span class="label">Recibido en ${mName}</span>
        <span class="amount-big ${totalReal > 0 ? "positive" : "neutral"} num sum-amount">${money(totalReal)}</span>
        ${totalBudgeted > 0 ? `
          <div class="sum-sub">de ${money(totalBudgeted)} esperados · ${Math.round(totalReal / totalBudgeted * 100)}%</div>
          <div class="progress-bar" role="img" aria-label="${Math.round(pct * 100)}% de lo esperado">
            <div class="progress-fill" style="width:${pct * 100}%;"></div>
          </div>` : ""}
        <p class="sum-finding">${finding}</p>`;
    }

    // ── Por fuente de ingreso ─────────────────────────────
    function renderComparison() {
      const section  = document.getElementById("sources-section");
      const listEl   = document.getElementById("sources-list");
      const incomeArr = normalizeIncome(budget?.income);
      if (!incomeArr.length) { section.style.display = "none"; return; }
      section.style.display = "block";

      // Sumar ingresos reales por fuente (excluir proporcionales automáticos)
      const realBySource = incomes
        .filter(i => !i.isProportional)
        .reduce((acc, i) => {
          acc[i.source] = (acc[i.source] || 0) + Number(i.amount);
          return acc;
        }, {});

      // Proporcionales devengados hoy
      const propMap = {};
      if (propSummary) {
        propSummary.forEach(p => { propMap[p.name] = p; });
      }

      // Fuentes extra registradas pero no presupuestadas
      const budgetedNames = new Set(incomeArr.map(i => i.name));
      const extraSources  = Object.keys(realBySource).filter(s => !budgetedNames.has(s));

      const total = incomeArr.length + extraSources.length;
      document.getElementById("sources-count").textContent = `${total} ${total === 1 ? "fuente" : "fuentes"}`;

      listEl.innerHTML = [
        ...incomeArr.map(inc => sourceCardHTML(inc, realBySource[inc.name] || 0, propMap[inc.name])),
        ...extraSources.map(src => sourceCardHTML({name: src, amount: 0, type: "fijo", proportional: false}, realBySource[src] || 0, null))
      ].join("");
    }

    function sourceCardHTML(inc, receivedManual, prop) {
      const budgeted = Number(inc.amount || 0);

      // Para proporcionales: "recibido" = devengado hasta hoy
      // Para normales: "recibido" = suma de ingresos reales registrados
      const received  = inc.proportional && prop ? prop.accruedAmount : receivedManual;

      const diff      = received - budgeted;
      const diffVal   = Math.abs(diff);

      const typeLabel  = inc.proportional
        ? (typeLabels[inc.type] || inc.type) + " · Proporcional"
        : budgeted > 0 ? (typeLabels[inc.type] || inc.type) : "Sin presupuestar";

      let right = "";
      if (budgeted > 0) {
        right = diff > 0 ? `<span class="num row-meta pos">+${money(diffVal)} extra</span>`
              : diff < 0 ? `<span class="num row-meta">Pendiente ${money(diffVal)}</span>`
              : `<span class="row-meta">Completo</span>`;
      }

      return `
        <li class="row">
          <div class="row-line">
            <span class="row-title">
              <span class="row-name">${esc(formatName(inc.name))}</span>
              <span class="row-type">${esc(typeLabel)}</span>
            </span>
            <span class="num row-amt ${received ? "" : "zero"}">${money(received)}</span>
          </div>
          ${budgeted > 0 ? `
            <div class="progress-bar" role="img" aria-label="${Math.round(Math.min(received / budgeted, 1) * 100)}% recibido">
              <div class="progress-fill" style="width:${Math.min(received / budgeted, 1) * 100}%;"></div>
            </div>
            <div class="row-line">
              <span class="num row-meta">de ${money(budgeted)}</span>
              ${right}
            </div>` : ""}
        </li>`;
    }

    // ── Lista ingresos ────────────────────────────────────
    function renderIncomes() {
      const el = document.getElementById("incomes-list");
      document.getElementById("incomes-count").textContent =
        incomes.length ? `${incomes.length} ${incomes.length === 1 ? "registro" : "registros"}` : "";
      if (!incomes.length) {
        el.innerHTML = `<div class="empty-state"><p>No hay ingresos registrados este mes. Usa el botón + de arriba para registrar uno.</p></div>`;
        return;
      }
      const groups = incomes.reduce((acc, i) => {
        (acc[i.date] = acc[i.date] || []).push(i);
        return acc;
      }, {});
      const sortedDates = Object.keys(groups).sort().reverse();
      el.innerHTML = sortedDates.map(date => `
        <div class="date-group">
          <span class="label">${dayLabel(date)}</span>
          <ul class="rows">
            ${groups[date].map(i => {
              const meta = [i.description, i.walletName ? `→ ${i.walletName}` : ""].filter(Boolean).map(esc).join(" · ");
              return `
              <li class="row income-item">
                <div class="income-left" data-id="${i.id}">
                  <div class="row-line">
                    <span class="row-name">${esc(formatName(i.source))}</span>
                    <span class="num row-amt">+${money(Number(i.amount))}</span>
                  </div>
                  ${meta ? `<div class="row-meta" style="margin-top:4px;">${meta}</div>` : ""}
                </div>
                <button class="btn-danger" data-id="${i.id}" type="button" aria-label="Eliminar ingreso">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
              </li>`;
            }).join("")}
          </ul>
        </div>
      `).join("");
    }

    // ── Sugerencias de fuentes ────────────────────────────
    function populateSourcesSuggestions() {
      const sources = [...new Set([
        ...incomes.map(i => i.source),
        ...normalizeIncome(budget?.income).map(i => i.name)
      ])];
      document.getElementById("sources-datalist").innerHTML =
        sources.map(s => `<option value="${s}">`).join("");
    }

    // ── Populate wallet select ────────────────────────────
    function populateWalletSelect() {
      const sel = document.getElementById("field-wallet");
      sel.innerHTML = `<option value="">Sin cajita asignada</option>` +
        wallets.map(w => `<option value="${w.id}" data-name="${w.name}">${w.icon || "🏦"} ${w.name} — ${formatCOP(w.balance)}</option>`).join("");
    }

    // ── Drawer nuevo ──────────────────────────────────────
    function openNewDrawer() {
      editingId = null;
      document.getElementById("drawer-title").textContent = "Nuevo ingreso";
      document.getElementById("field-date").value         = today();
      document.getElementById("field-source").value       = "";
      const amtInp = document.getElementById("field-amount");
      amtInp.dataset.raw = ""; amtInp.value = "";
      document.getElementById("field-wallet").value       = "";
      document.getElementById("field-description").value  = "";
      document.getElementById("btn-save").textContent     = "Registrar ingreso";
      openDrawer();
    }

    // ── Drawer editar ─────────────────────────────────────
    function openEditDrawer(id) {
      const i = incomes.find(x => x.id === id);
      if (!i) return;
      editingId = id;
      document.getElementById("drawer-title").textContent = "Editar ingreso";
      document.getElementById("field-date").value         = i.date;
      document.getElementById("field-source").value       = i.source;
      const amtInp = document.getElementById("field-amount");
      const rawAmt = String(i.amount || "").replace(/[^0-9]/g, "");
      amtInp.dataset.raw = rawAmt;
      amtInp.value = rawAmt ? Number(rawAmt).toLocaleString("es-CO") : "";
      document.getElementById("field-wallet").value       = i.walletId || "";
      document.getElementById("field-description").value  = i.description || "";
      document.getElementById("btn-save").textContent     = "Actualizar ingreso";
      openDrawer();
    }

    // ── Guardar ───────────────────────────────────────────
    async function saveIncome() {
      const date        = document.getElementById("field-date").value;
      const source      = document.getElementById("field-source").value.trim();
      const amount      = getNumericValue(document.getElementById("field-amount"));
      const walletId    = document.getElementById("field-wallet").value;
      const description = document.getElementById("field-description").value.trim();
      const btn         = document.getElementById("btn-save");

      const walletOpt  = document.querySelector(`#field-wallet option[value="${walletId}"]`);
      const walletName = walletOpt?.dataset.name || "";

      if (!date || !source || !amount) {
        showToast("Completa fecha, fuente y valor.", "error"); return;
      }

      btn.disabled = true; btn.textContent = "Guardando...";
      const data = { date, source, amount, description, walletId, walletName };

      try {
        if (editingId) {
          const old = incomes.find(x => x.id === editingId);
          await updateIncome(uid, editingId, old, data);
          showToast("Ingreso actualizado.", "success");
        } else {
          await addIncome(uid, data);
          showToast("Ingreso registrado.", "success");
        }
        closeDrawer();
        wallets = await getWallets(uid);
        populateWalletSelect();
        await loadAll();
      } catch (err) {
        showToast("Error al guardar.", "error");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.textContent = editingId ? "Actualizar ingreso" : "Registrar ingreso";
      }
    }

    // ── Eliminar ──────────────────────────────────────────
    async function handleDelete(id) {
      if (!confirm("¿Eliminar este ingreso? El saldo de la cajita se ajustará.")) return;
      try {
        const i = incomes.find(x => x.id === id);
        await deleteIncome(uid, id, i);
        showToast("Ingreso eliminado.", "success");
        wallets = await getWallets(uid);
        populateWalletSelect();
        await loadAll();
      } catch (err) {
        showToast("Error al eliminar.", "error");
      }
    }

    function openDrawer() {
      document.getElementById("drawer-overlay").classList.add("open");
      document.getElementById("drawer").classList.add("open");
    }
    function closeDrawer() {
      document.getElementById("drawer-overlay").classList.remove("open");
      document.getElementById("drawer").classList.remove("open");
    }
  </script>
</body>
</html>
