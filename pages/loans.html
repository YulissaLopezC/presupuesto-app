<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presupuesto · Préstamos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../assets/style.css?v=20261018"/>
  <style>
    /* ── Layout ─────────────────────────────────────────────
       Móvil: una columna de 680px máx.
       Escritorio (≥ 900px): resumen 5fr (fijo al hacer scroll) + deudores 7fr, gap 16px. */
    .lns {
      max-width: 680px; margin: 0 auto;
      padding: 20px 20px 0;
      display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px;
    }
    .lns .card { margin-bottom: 0; }
    .lns-col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-content: start; min-width: 0; }

    /* ── Título + acciones (igual que Ingresos) ──────────── */
    .lns-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .lns-head h1 {
      font-family: "Sora", sans-serif; font-size: 22px; font-weight: 600;
      letter-spacing: -0.02em; color: var(--text);
    }
    /* Nuevo préstamo: círculo en móvil (como Cajitas), botón primario en escritorio */
    .lns-new {
      width: 44px; height: 44px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-family: "Public Sans", sans-serif;
      transition: border-color 0.2s, background 0.2s;
    }
    .lns-new:hover { border-color: var(--text); }
    .lns-new-lbl { display: none; }

    /* ── Cifras ──────────────────────────────────────────── */
    .num {
      font-family: "Sora", sans-serif; font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em; white-space: nowrap;
    }
    .num.pos { color: var(--income); }

    /* ── Resumen: por cobrar ─────────────────────────────── */
    .sum-amount { display: block; margin-top: 10px; }
    .sum-sub {
      font-family: "Sora", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-top: 8px;
    }
    .sum-card .progress-bar { height: 10px; margin-top: 16px; }

    /* Tira de cifras (igual que "Este mes" en Inicio) */
    .month-grid { display: grid; grid-template-columns: 1fr 1fr; margin-top: 18px; }
    .month-cell { padding: 14px 0; border-top: 1px solid var(--border-soft); }
    .month-cell:nth-child(odd)  { padding-right: 14px; }
    .month-cell:nth-child(even) { padding-left: 14px; border-left: 1px solid var(--border-soft); }
    .month-cell .num { display: block; font-size: 18px; font-weight: 700; margin-top: 6px; color: var(--text); }
    .month-cell .num.pos { color: var(--income); }
    .month-cell .num.zero { color: var(--muted); }

    /* ── Encabezado de sección dentro de tarjeta ─────────── */
    .sect-hdr {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; min-height: 24px;
    }
    .sect-hdr h2 {
      font-family: "Public Sans", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    }
    .sect-count { font-size: 13px; color: var(--muted); }

    /* ── Filas (igual que Inicio) ────────────────────────── */
    .rows { list-style: none; margin-top: 8px; }
    .row { padding: 16px 0; border-top: 1px solid var(--border-soft); }
    .row:first-child { border-top: none; }
    .row-line {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    }
    .row-name {
      font-size: 15px; font-weight: 600; color: var(--text);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row-amt { font-size: 16px; font-weight: 600; color: var(--text); }
    .row-meta {
      font-size: 13px; color: var(--muted);
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .row .num.row-meta { font-weight: 600; }
    .row .progress-bar { margin: 12px 0 8px; }

    /* Deudor: iniciales + nombre + saldo */
    .debtor-top { display: flex; align-items: center; gap: 12px; }
    .debtor-avatar {
      width: 36px; height: 36px; border-radius: 999px; flex-shrink: 0;
      background: var(--surface2); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
    }
    .debtor-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .debtor-owes { text-align: right; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px; }

    /* Acciones del deudor */
    .loan-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .loan-actions .btn-ghost {
      min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px;
      color: var(--text); font-weight: 600;
    }
    .detail-toggle {
      margin-right: auto; background: none; border: none; cursor: pointer;
      font-family: "Public Sans", sans-serif; font-size: 14px; font-weight: 600; color: var(--text);
      padding: 4px 0; border-bottom: 1px solid var(--border); transition: border-color 0.2s;
    }
    .detail-toggle:hover { border-color: var(--text); }
    .icon-del {
      width: 40px; height: 40px; padding: 0; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }

    /* Detalle expandido: préstamos y abonos */
    .debtor-detail {
      margin-top: 14px; padding: 4px 16px;
      background: var(--bg); border-radius: 14px;
    }
    .detail-section { padding: 12px 0; }
    .detail-section + .detail-section { border-top: 1px solid var(--border); }
    .detail-section-hdr {
      font-size: 12px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
    }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
    .item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item-date { font-size: 13px; font-weight: 600; color: var(--text); }
    .item-sub {
      font-size: 13px; color: var(--muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-amount { font-size: 15px; font-weight: 600; color: var(--text); }
    .item-amount.payment-v { color: var(--income); }
    .item-del {
      width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px;
      background: none; border: none; color: var(--muted); cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
    }
    .item-del:hover { background: rgba(217,63,63,0.1); color: var(--danger); }
    .no-items { font-size: 13px; color: var(--muted); padding: 6px 0; }

    .paid-loans-link { width: 100%; margin-top: 8px; color: var(--text); font-weight: 600; }

    /* ── Estados ─────────────────────────────────────────── */
    .lns .empty-state { padding: 28px 12px; }
    .lns .empty-state p { margin-top: 0; color: var(--text); }
    .sk-line { height: 14px; }

    /* ── Modales ─────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(14,23,38,0.5);
      z-index: 150; opacity: 0; pointer-events: none; visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; visibility: visible; }
    .modal {
      background: var(--surface); border-radius: 20px; padding: 24px 20px 20px;
      width: 100%; max-width: 480px;
      transform: scale(0.97); opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      max-height: 90vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-overlay.open .modal { transform: scale(1); opacity: 1; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
    .modal-title {
      font-family: "Sora", sans-serif; font-size: 18px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text);
    }
    .modal-subtitle { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .modal-close {
      width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: border-color 0.2s;
    }
    .modal-close:hover { border-color: var(--text); }
    .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .form-textarea { resize: none; height: 80px; }
    .form-optional { text-transform: none; letter-spacing: 0; font-weight: 400; }
    /* Tarjeta de valor (como en el registro de Movimientos) */
    .amount-block {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 16px; display: flex; align-items: center; gap: 6px; min-height: 56px;
      transition: border-color 0.2s;
    }
    .amount-block:focus-within { border-color: var(--accent); }
    .amount-sym { font-family: "Sora", sans-serif; font-size: 22px; font-weight: 700; color: var(--muted); }
    .amount-input {
      font-family: "Sora", sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em;
      color: var(--text); border: none; background: transparent; outline: none;
      flex: 1; min-width: 0; font-variant-numeric: tabular-nums;
    }
    .amount-input::placeholder { color: var(--muted); opacity: 0.5; }
    .modal .btn-primary { margin-top: 4px; }

    /* Lista del modal de pagados */
    .paid-loan-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border-soft); }
    .paid-loan-item:first-child { border-top: none; }

    /* Móvil: acciones en una fila + "Ver detalle" debajo; campos del modal apilados */
    @media (max-width: 899px) {
      .loan-actions { display: grid; grid-template-columns: 1fr 1fr 40px; }
      .loan-actions .btn-ghost { justify-content: center; }
      .detail-toggle { order: 3; grid-column: 1 / -1; justify-self: start; margin-right: 0; }
    }
    @media (max-width: 480px) {
      .two-col { grid-template-columns: minmax(0, 1fr); gap: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill, .modal, .modal-overlay, .lns-new, .item-del, .detail-toggle { transition: none; }
      .skeleton { animation: none; }
    }

    /* ── Escritorio ≥ 900px ──────────────────────────────── */
    @media (min-width: 900px) {
      .lns {
        max-width: 1240px; padding: 32px;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px;
      }
      .lns-col  { gap: 16px; }
      .lns-head { grid-column: 1 / -1; }
      .lns-head h1 { font-size: 26px; }
      .lns-side { align-self: start; position: sticky; top: 32px; }
      .lns-new {
        width: auto; height: 44px; padding: 0 18px; border: none; border-radius: 12px; gap: 6px;
        background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
      }
      .lns-new:hover { background: var(--accent-strong); }
      .lns-new-lbl { display: inline; }
    }
  </style>
</head>
<body>
  <main class="lns">

    <div class="lns-head">
      <h1>Préstamos</h1>
      <button class="lns-new" id="fab" type="button" aria-label="Nuevo préstamo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span class="lns-new-lbl">Nuevo préstamo</span>
      </button>
    </div>

    <!-- Por cobrar -->
    <div class="lns-col lns-side">
      <section class="card sum-card" id="stats-row" aria-live="polite">
        <div class="skeleton sk-line" style="width:40%;"></div>
        <div class="skeleton" style="height:38px;width:60%;margin-top:12px;"></div>
        <div class="skeleton sk-line" style="width:55%;margin-top:10px;"></div>
        <div class="skeleton" style="height:10px;margin-top:22px;border-radius:999px;"></div>
      </section>
    </div>

    <!-- Deudores -->
    <div class="lns-col">
      <section class="card">
        <div class="sect-hdr">
          <h2>Deudores</h2>
          <span class="sect-count" id="debtors-count"></span>
        </div>
        <div id="debtors-list">
          <ul class="rows">
            <li class="row"><div class="skeleton" style="height:96px;"></div></li>
            <li class="row"><div class="skeleton" style="height:96px;"></div></li>
          </ul>
        </div>
      </section>
    </div>

  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>

  <!-- Modal: Nuevo deudor -->
  <div class="modal-overlay" id="debtor-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="debtor-title">
      <div class="modal-hdr">
        <h2 class="modal-title" id="debtor-title">Nuevo préstamo</h2>
        <button class="modal-close" id="debtor-close" type="button" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">Registra a quién le prestas y cuánto.</p>

      <div class="form-group">
        <label class="form-label" for="debtor-name">¿A quién le prestas?</label>
        <input type="text" class="form-input" id="debtor-name" placeholder="Nombre del contacto" maxlength="60"/>
      </div>

      <div class="form-group">
        <label class="form-label" for="debtor-amount">Monto prestado</label>
        <div class="amount-block">
          <span class="amount-sym">$</span>
          <input type="number" class="amount-input" id="debtor-amount" placeholder="0" min="0" inputmode="decimal"/>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="debtor-date">Fecha</label>
          <input type="date" class="form-input" id="debtor-date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="debtor-wallet">¿De cuál cajita sale?</label>
          <select class="form-select" id="debtor-wallet">
            <option value="">Sin cajita</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="debtor-notes">Notas <span class="form-optional">(opcional)</span></label>
        <textarea class="form-input form-textarea" id="debtor-notes" placeholder="Motivo o recordatorio del préstamo..."></textarea>
      </div>

      <button class="btn-primary" id="btn-save-debtor" type="button">Registrar préstamo</button>
    </div>
  </div>

  <!-- Modal: Nuevo préstamo a deudor existente -->
  <div class="modal-overlay" id="loan-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="loan-modal-title">
      <div class="modal-hdr">
        <h2 class="modal-title" id="loan-modal-title">Nuevo préstamo</h2>
        <button class="modal-close" id="loan-close" type="button" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">Agrega otro préstamo a la misma persona.</p>

      <div class="form-group">
        <label class="form-label" for="loan-amount">Monto prestado</label>
        <div class="amount-block">
          <span class="amount-sym">$</span>
          <input type="number" class="amount-input" id="loan-amount" placeholder="0" min="0" inputmode="decimal"/>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="loan-date">Fecha</label>
          <input type="date" class="form-input" id="loan-date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="loan-wallet">¿De cuál cajita sale?</label>
          <select class="form-select" id="loan-wallet">
            <option value="">Sin cajita</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="loan-notes">Notas <span class="form-optional">(opcional)</span></label>
        <textarea class="form-input form-textarea" id="loan-notes" placeholder="Motivo del préstamo..."></textarea>
      </div>

      <button class="btn-primary" id="btn-save-loan" type="button">Agregar préstamo</button>
    </div>
  </div>

  <!-- Modal: Registrar abono -->
  <div class="modal-overlay" id="pay-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-title">
      <div class="modal-hdr">
        <h2 class="modal-title" id="pay-title">Registrar abono</h2>
        <button class="modal-close" id="pay-close" type="button" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">El abono se aplica al total que debe esta persona.</p>

      <div class="form-group">
        <label class="form-label" for="pay-amount">Monto del abono</label>
        <div class="amount-block">
          <span class="amount-sym">$</span>
          <input type="number" class="amount-input" id="pay-amount" placeholder="0" min="0" inputmode="decimal"/>
        </div>
      </div>

      <div class="two-col">
        <div class="form-group">
          <label class="form-label" for="pay-date">Fecha</label>
          <input type="date" class="form-input" id="pay-date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="pay-wallet">¿A cuál cajita entra?</label>
          <select class="form-select" id="pay-wallet">
            <option value="">Sin cajita</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="pay-notes">Notas <span class="form-optional">(opcional)</span></label>
        <textarea class="form-input form-textarea" id="pay-notes" placeholder="Ej. Pago parcial..."></textarea>
      </div>

      <button class="btn-primary" id="btn-save-pay" type="button">Registrar abono</button>
    </div>
  </div>

  <!-- Modal: Préstamos pagados -->
  <div class="modal-overlay" id="paid-overlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="paid-title">
      <div class="modal-hdr">
        <h2 class="modal-title" id="paid-title">Préstamos pagados</h2>
        <button class="modal-close" id="paid-close" type="button" aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <p class="modal-subtitle">Deudas ya saldadas al 100%.</p>
      <div id="paid-loans-list"></div>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from "../modules/auth.js?v=20261018";
    import {
      addDebtor, getDebtors, deleteDebtor,
      addLoan, getLoans, deleteLoan,
      addLoanPayment, getLoanPayments, deleteLoanPayment,
      migrateOldLoans, getWallets
    } from "../modules/db.js?v=20261018";
    import { renderBottomNav, showToast } from "../assets/ui.js?v=20261018";
    import { formatCOP, formatDate, today, applyNumericFormat, getNumericValue, formatName } from "../assets/utils.js?v=20261018";

    window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

    let uid, debtors = [], wallets = [], activeDebtorId = null;
    const detailCache = {};

    // ── Presentación: formato de cifras y textos ──────────
    // "$ 1.234" → "$1.234" (formato del DESIGN.md)
    const money    = v => formatCOP(Math.abs(v)).replace(/\s/g, "");
    const esc      = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const initials = name => (name || "?").split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
    const icoX     = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    const icoTrash = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>`;

    const user = await requireAuth();
    uid = user.uid;
    renderBottomNav("loans");
    wallets = await getWallets(uid);
    populateWalletSelects();

    try {
      const n = await migrateOldLoans(uid);
      if (n > 0) showToast(`${n} deudor${n > 1 ? "es migrados" : " migrado"} al nuevo formato.`, "success");
    } catch(e) { console.warn("Migration error:", e); }

    await loadDebtors();
    applyNumericFormat(document.getElementById("debtor-amount"));
    applyNumericFormat(document.getElementById("loan-amount"));
    applyNumericFormat(document.getElementById("pay-amount"));

    // ── Data ─────────────────────────────────────────────────
    async function loadDebtors() {
      debtors = await getDebtors(uid);
      renderStats();
      renderDebtors();
    }

    // ── Stats ─────────────────────────────────────────────────
    function renderStats() {
      const totalPend = debtors.reduce((s, d) => s + Math.max(Number(d.totalAmount||0) - Number(d.totalPaid||0), 0), 0);
      const totalPaid = debtors.reduce((s, d) => s + Number(d.totalPaid||0), 0);
      const totalLent = debtors.reduce((s, d) => s + Number(d.totalAmount||0), 0);
      const owing     = debtors.filter(d => d.status !== "pagado").length;
      const pct       = totalLent > 0 ? Math.min(totalPaid / totalLent, 1) : 0;

      document.getElementById("stats-row").innerHTML = `
        <span class="label">Por cobrar</span>
        <span class="amount-big neutral num sum-amount">${money(totalPend)}</span>
        <div class="sum-sub">${owing ? `${owing} ${owing === 1 ? "persona te debe" : "personas te deben"}` : "Nadie te debe en este momento"}</div>
        ${totalLent > 0 ? `
          <div class="progress-bar" role="img" aria-label="${Math.round(pct * 100)}% cobrado">
            <div class="progress-fill" style="width:${pct * 100}%;"></div>
          </div>` : ""}
        <div class="month-grid">
          <div class="month-cell">
            <span class="label">Prestado</span>
            <span class="num ${totalLent ? "" : "zero"}">${money(totalLent)}</span>
          </div>
          <div class="month-cell">
            <span class="label">Cobrado</span>
            <span class="num ${totalPaid ? "pos" : "zero"}">${money(totalPaid)}</span>
          </div>
        </div>`;
    }

    // ── Debtor list ───────────────────────────────────────────
    function renderDebtors() {
      const el     = document.getElementById("debtors-list");
      const active = debtors.filter(d => d.status !== "pagado");
      const paid   = debtors.filter(d => d.status === "pagado");

      document.getElementById("debtors-count").textContent =
        active.length ? `${active.length} con saldo` : "";

      if (!active.length && !paid.length) {
        el.innerHTML = `<div class="empty-state"><p>No tienes préstamos registrados. Usa el botón + de arriba para registrar el primero.</p></div>`;
        return;
      }

      let html = active.length
        ? `<ul class="rows">${active.map(renderDebtorCard).join("")}</ul>`
        : `<div class="empty-state"><p>No hay préstamos pendientes: todos te pagaron.</p></div>`;

      if (paid.length) {
        const c = paid.length;
        html += `<button class="btn-ghost paid-loans-link" type="button" onclick="openPaidModal()">
          Ver ${c} préstamo${c > 1 ? "s" : ""} pagado${c > 1 ? "s" : ""}
        </button>`;
      }

      el.innerHTML = html;
    }

    function renderDebtorCard(d) {
      const totalAmt  = Number(d.totalAmount || 0);
      const totalPaid = Number(d.totalPaid   || 0);
      const pending   = Math.max(totalAmt - totalPaid, 0);
      const pct       = totalAmt > 0 ? Math.min(Math.round(totalPaid / totalAmt * 100), 100) : 0;
      const isPaid    = d.status === "pagado";
      const name      = formatName(d.name);

      return `
        <li class="row" id="dcard-${d.id}">
          <div class="debtor-top">
            <div class="debtor-avatar" aria-hidden="true">${esc(initials(name))}</div>
            <div class="debtor-body">
              <span class="row-name">${esc(name)}</span>
              <span class="num row-meta">Prestado ${money(totalAmt)}</span>
            </div>
            <div class="debtor-owes">
              <span class="num row-amt">${money(pending)}</span>
              <span class="row-meta">${isPaid ? "Pagado" : "Te debe"}</span>
            </div>
          </div>
          <div class="progress-bar" role="img" aria-label="${pct}% pagado">
            <div class="progress-fill" style="width:${pct}%;"></div>
          </div>
          <div class="row-line">
            <span class="num row-meta">Abonado ${money(totalPaid)}</span>
            <span class="row-meta">${pct}% pagado</span>
          </div>
          <div class="loan-actions">
            <button class="detail-toggle" type="button" onclick="toggleDetail('${d.id}')">Ver detalle</button>
            <button class="btn-ghost" type="button" onclick="openAddLoanModal('${d.id}')">+ Préstamo</button>
            ${!isPaid ? `<button class="btn-ghost" type="button" onclick="openPayModal('${d.id}',${pending})">+ Abono</button>` : ""}
            <button class="btn-danger icon-del" type="button" aria-label="Eliminar a ${esc(name)}" onclick="handleDeleteDebtor('${d.id}')">${icoTrash}</button>
          </div>
          <div class="debtor-detail" id="ddetail-${d.id}" style="display:none;"></div>
        </li>`;
    }

    // ── Expandir detalle ──────────────────────────────────────
    window.toggleDetail = async (id) => {
      const el  = document.getElementById(`ddetail-${id}`);
      const btn = document.querySelector(`#dcard-${id} .detail-toggle`);
      if (el.style.display !== "none") {
        el.style.display = "none";
        btn.textContent  = "Ver detalle";
        return;
      }
      el.style.display = "block";
      btn.textContent  = "Ocultar detalle";
      el.innerHTML = "<div style='font-size:12px;color:#888;padding:8px 0;'>Cargando...</div>";
      const [loans, payments] = await Promise.all([getLoans(uid, id), getLoanPayments(uid, id)]);
      detailCache[id] = { loans, payments };
      renderDetail(id, loans, payments);
    };

    function renderDetail(debtorId, loans, payments) {
      const el = document.getElementById(`ddetail-${debtorId}`);

      const itemMain = it => {
        const sub = [it.walletName, it.notes].filter(Boolean).map(t => esc(formatName(t))).join(" · ");
        return `<span class="item-date">${formatDate(it.date)}</span>${sub ? `<span class="item-sub">${sub}</span>` : ""}`;
      };

      const loansHTML = loans.length
        ? loans.map(l => `
            <div class="item-row">
              <div class="item-main">${itemMain(l)}</div>
              <span class="num item-amount">${money(l.amount)}</span>
              <button class="item-del" type="button" aria-label="Eliminar préstamo" onclick="handleDeleteLoan('${debtorId}','${l.id}')">${icoX}</button>
            </div>`).join("")
        : `<div class="no-items">Sin préstamos individuales registrados.</div>`;

      const paysHTML = payments.length
        ? payments.map(p => `
            <div class="item-row">
              <div class="item-main">${itemMain(p)}</div>
              <span class="num item-amount payment-v">+${money(p.amount)}</span>
              <button class="item-del" type="button" aria-label="Eliminar abono" onclick="handleDelPay('${debtorId}','${p.id}')">${icoX}</button>
            </div>`).join("")
        : `<div class="no-items">Sin abonos registrados.</div>`;

      el.innerHTML = `
        <div class="detail-section">
          <div class="detail-section-hdr">Préstamos</div>
          ${loansHTML}
        </div>
        <div class="detail-section">
          <div class="detail-section-hdr">Abonos</div>
          ${paysHTML}
        </div>`;
    }

    // ── Eliminar deudor completo ──────────────────────────────
    window.handleDeleteDebtor = async (id) => {
      if (!confirm("¿Eliminar este deudor y todos sus registros?\nSe revertirán los montos en cajitas.")) return;
      try {
        await deleteDebtor(uid, id);
        showToast("Deudor eliminado.", "success");
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error al eliminar.", "error"); console.error(e); }
    };

    // ── Eliminar préstamo individual ──────────────────────────
    window.handleDeleteLoan = async (debtorId, loanId) => {
      if (!confirm("¿Eliminar este préstamo? Se revertirá el monto a la cajita.")) return;
      const loan = detailCache[debtorId]?.loans.find(l => l.id === loanId);
      if (!loan) { showToast("Error: recarga la página.", "error"); return; }
      try {
        await deleteLoan(uid, debtorId, loanId, { amount: loan.amount, walletId: loan.walletId || "" });
        showToast("Préstamo eliminado.", "success");
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error al eliminar.", "error"); console.error(e); }
    };

    // ── Eliminar abono ────────────────────────────────────────
    window.handleDelPay = async (debtorId, payId) => {
      if (!confirm("¿Eliminar este abono?")) return;
      const pay = detailCache[debtorId]?.payments.find(p => p.id === payId);
      if (!pay) { showToast("Error: recarga la página.", "error"); return; }
      try {
        await deleteLoanPayment(uid, debtorId, payId, { amount: pay.amount, walletId: pay.walletId || "" });
        showToast("Abono eliminado.", "success");
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error al eliminar.", "error"); console.error(e); }
    };

    // ── Modal: Nuevo deudor ───────────────────────────────────
    document.getElementById("fab").addEventListener("click", openDebtorModal);
    document.getElementById("debtor-close").addEventListener("click", closeDebtorModal);
    document.getElementById("debtor-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("debtor-overlay")) closeDebtorModal();
    });

    function openDebtorModal() {
      document.getElementById("debtor-name").value   = "";
      document.getElementById("debtor-date").value   = today();
      document.getElementById("debtor-wallet").value = "";
      document.getElementById("debtor-notes").value  = "";
      const inp = document.getElementById("debtor-amount");
      inp.dataset.raw = ""; inp.value = "";
      document.getElementById("debtor-overlay").classList.add("open");
      document.getElementById("debtor-name").focus();
    }
    function closeDebtorModal() { document.getElementById("debtor-overlay").classList.remove("open"); }

    document.getElementById("btn-save-debtor").addEventListener("click", async () => {
      const name     = document.getElementById("debtor-name").value.trim();
      const amount   = getNumericValue(document.getElementById("debtor-amount"));
      const date     = document.getElementById("debtor-date").value;
      const walletId = document.getElementById("debtor-wallet").value;
      const walletOpt  = document.querySelector(`#debtor-wallet option[value="${walletId}"]`);
      const walletName = walletOpt?.dataset.name || "";
      const notes    = document.getElementById("debtor-notes").value.trim();
      const btn      = document.getElementById("btn-save-debtor");

      if (!name)   { showToast("Escribe el nombre del deudor.", "error"); return; }
      if (!amount) { showToast("Ingresa el monto prestado.",   "error"); return; }

      btn.disabled = true; btn.childNodes[0].textContent = "Guardando...";
      try {
        await addDebtor(uid, name, { amount, date, walletId, walletName, notes });
        showToast("Deudor registrado.", "success");
        closeDebtorModal();
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error.", "error"); console.error(e); }
      finally { btn.disabled = false; btn.childNodes[0].textContent = "Registrar préstamo"; }
    });

    // ── Modal: Nuevo préstamo a deudor existente ──────────────
    window.openAddLoanModal = (debtorId) => {
      activeDebtorId = debtorId;
      const d = debtors.find(x => x.id === debtorId);
      document.getElementById("loan-modal-title").textContent = `Nuevo préstamo · ${formatName(d?.name)}`;
      document.getElementById("loan-date").value   = today();
      document.getElementById("loan-wallet").value = "";
      document.getElementById("loan-notes").value  = "";
      const inp = document.getElementById("loan-amount");
      inp.dataset.raw = ""; inp.value = "";
      document.getElementById("loan-overlay").classList.add("open");
      inp.focus();
    };

    function closeLoanModal() {
      document.getElementById("loan-overlay").classList.remove("open");
      activeDebtorId = null;
    }
    document.getElementById("loan-close").addEventListener("click", closeLoanModal);
    document.getElementById("loan-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("loan-overlay")) closeLoanModal();
    });

    document.getElementById("btn-save-loan").addEventListener("click", async () => {
      const amount   = getNumericValue(document.getElementById("loan-amount"));
      const date     = document.getElementById("loan-date").value;
      const walletId = document.getElementById("loan-wallet").value;
      const walletOpt  = document.querySelector(`#loan-wallet option[value="${walletId}"]`);
      const walletName = walletOpt?.dataset.name || "";
      const notes    = document.getElementById("loan-notes").value.trim();
      const btn      = document.getElementById("btn-save-loan");

      if (!amount || !activeDebtorId) { showToast("Ingresa el monto prestado.", "error"); return; }

      btn.disabled = true; btn.childNodes[0].textContent = "Guardando...";
      try {
        await addLoan(uid, activeDebtorId, { amount, date, walletId, walletName, notes });
        showToast("Préstamo agregado.", "success");
        closeLoanModal();
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error.", "error"); console.error(e); }
      finally { btn.disabled = false; btn.childNodes[0].textContent = "Agregar préstamo"; }
    });

    // ── Modal: Registrar abono ────────────────────────────────
    window.openPayModal = (debtorId, pending) => {
      activeDebtorId = debtorId;
      const d = debtors.find(x => x.id === debtorId);
      document.getElementById("pay-title").textContent = `Abono de ${formatName(d?.name)}`;
      const inp = document.getElementById("pay-amount");
      const raw = pending > 0 ? String(Math.round(pending)) : "";
      inp.dataset.raw = raw;
      inp.value = raw ? Number(raw).toLocaleString("es-CO") : "";
      document.getElementById("pay-date").value   = today();
      document.getElementById("pay-wallet").value = "";
      document.getElementById("pay-notes").value  = "";
      document.getElementById("pay-overlay").classList.add("open");
      inp.focus();
    };

    function closePayModal() {
      document.getElementById("pay-overlay").classList.remove("open");
      activeDebtorId = null;
    }
    document.getElementById("pay-close").addEventListener("click", closePayModal);
    document.getElementById("pay-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("pay-overlay")) closePayModal();
    });

    document.getElementById("btn-save-pay").addEventListener("click", async () => {
      const amount   = getNumericValue(document.getElementById("pay-amount"));
      const date     = document.getElementById("pay-date").value;
      const walletId = document.getElementById("pay-wallet").value;
      const walletOpt  = document.querySelector(`#pay-wallet option[value="${walletId}"]`);
      const walletName = walletOpt?.dataset.name || "";
      const notes    = document.getElementById("pay-notes").value.trim();
      const btn      = document.getElementById("btn-save-pay");

      if (!amount || !activeDebtorId) { showToast("Ingresa el monto del abono.", "error"); return; }

      btn.disabled = true; btn.childNodes[0].textContent = "Guardando...";
      try {
        await addLoanPayment(uid, activeDebtorId, { amount, date, walletId, walletName, notes });
        showToast("Abono registrado.", "success");
        closePayModal();
        wallets = await getWallets(uid);
        populateWalletSelects();
        await loadDebtors();
      } catch(e) { showToast("Error.", "error"); console.error(e); }
      finally { btn.disabled = false; btn.childNodes[0].textContent = "Registrar abono"; }
    });

    // ── Modal: Préstamos pagados ──────────────────────────────
    window.openPaidModal = () => {
      document.getElementById("paid-loans-list").innerHTML = renderPaidLoans();
      document.getElementById("paid-overlay").classList.add("open");
    };
    function closePaidModal() { document.getElementById("paid-overlay").classList.remove("open"); }
    document.getElementById("paid-close").addEventListener("click", closePaidModal);
    document.getElementById("paid-overlay").addEventListener("click", e => {
      if (e.target === document.getElementById("paid-overlay")) closePaidModal();
    });

    function renderPaidLoans() {
      const paid = debtors.filter(d => d.status === "pagado");
      return paid.map(d => {
        const totalAmt  = Number(d.totalAmount || 0);
        const totalPaid = Number(d.totalPaid   || 0);
        const name      = formatName(d.name);
        return `
          <div class="paid-loan-item">
            <div class="debtor-avatar" aria-hidden="true">${esc(initials(name))}</div>
            <div class="debtor-body">
              <span class="row-name">${esc(name)}</span>
              <span class="row-meta">Pagado</span>
            </div>
            <span class="num row-amt">${money(totalPaid)}<span class="row-meta" style="display:block;text-align:right;font-weight:600;">de ${money(totalAmt)}</span></span>
          </div>`;
      }).join("");
    }

    // ── Wallets ───────────────────────────────────────────────
    function populateWalletSelects() {
      const opts = `<option value="">Sin cajita asignada</option>` +
        wallets.map(w => `<option value="${w.id}" data-name="${w.name}">${w.icon || "🏦"} ${formatName(w.name)} · ${formatCOP(w.balance || 0)}</option>`).join("");
      ["debtor-wallet", "loan-wallet", "pay-wallet"].forEach(id => {
        document.getElementById(id).innerHTML = opts;
      });
    }
  </script>
</body>
</html>
