<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Presupuesto · Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="stylesheet" href="../assets/style.css?v=20261018"/>
  <style>
    /* ── Layout: una columna centrada, 400px de ancho ───────
       Sin barra de navegación: se quita el espacio inferior que deja style.css. */
    body {
      padding: 24px 20px !important;
      display: flex; align-items: center; justify-content: center;
    }
    .auth { width: 100%; max-width: 400px; }

    /* Marca (igual que en el sidebar) */
    .auth-brand {
      font-family: "Sora", sans-serif; font-size: 20px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--text);
      margin: 0 4px 16px;
    }

    .auth .card { padding: 28px 24px 24px; margin-bottom: 0; }
    .auth h1 {
      font-family: "Sora", sans-serif; font-size: 22px; font-weight: 600;
      letter-spacing: -0.02em; color: var(--text);
    }
    .auth-sub { font-size: 15px; color: var(--muted); margin-top: 6px; }

    /* ── Selector Ingresar / Registrarme (como Gasto / Ingreso en Movimientos) ── */
    .tabs {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
      background: var(--surface2); padding: 4px; border-radius: 14px;
      margin: 24px 0;
    }
    .tab {
      height: 42px; border: none; border-radius: 11px;
      font-family: "Public Sans", sans-serif; font-size: 15px; font-weight: 700;
      cursor: pointer; background: transparent; color: var(--muted);
      transition: background 0.15s, color 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); color: var(--text); }

    .auth .btn-primary { margin-top: 8px; }

    /* Error: paleta de .btn-danger del DESIGN.md */
    .error-msg {
      background: rgba(217,63,63,0.08);
      border: 1px solid rgba(217,63,63,0.3);
      color: var(--danger);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }

    .footer-note {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 20px;
    }

    /* Ocultar/mostrar secciones */
    #section-register { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .tab { transition: none; }
    }

    @media (min-width: 600px) {
      .auth .card { padding: 36px 32px 32px; }
    }
  </style>
</head>
<body>
  <main class="auth">
    <div class="auth-brand">Mi Presupuesto</div>

    <section class="card">
      <h1>Tu presupuesto, claro</h1>
      <p class="auth-sub">Control financiero personal.</p>

      <div class="tabs" role="tablist" aria-label="Ingresar o crear cuenta">
        <button class="tab active" id="tab-login-btn" type="button" role="tab">Ingresar</button>
        <button class="tab" id="tab-register-btn" type="button" role="tab">Registrarme</button>
      </div>

      <!-- Formulario Login -->
      <div id="section-login">
        <div class="form-group">
          <label class="form-label" for="login-email">Correo</label>
          <input type="email" class="form-input" id="login-email" placeholder="tu@correo.com" autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Contraseña</label>
          <input type="password" class="form-input" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
        </div>
        <button class="btn-primary" id="btn-login" type="button">Ingresar</button>
        <div class="error-msg" id="login-error" role="alert"></div>
      </div>

      <!-- Formulario Registro -->
      <div id="section-register">
        <div class="form-group">
          <label class="form-label" for="reg-email">Correo</label>
          <input type="email" class="form-input" id="reg-email" placeholder="tu@correo.com" autocomplete="email"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">Contraseña</label>
          <input type="password" class="form-input" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password2">Confirmar contraseña</label>
          <input type="password" class="form-input" id="reg-password2" placeholder="Repite tu contraseña" autocomplete="new-password"/>
        </div>
        <button class="btn-primary" id="btn-register" type="button">Crear cuenta</button>
        <div class="error-msg" id="register-error" role="alert"></div>
      </div>
    </section>

    <p class="footer-note">Tus datos son privados y solo tú los puedes ver.</p>
  </main>

  <script type="module">
    import { login, register, onAuthChange } from "../modules/auth.js?v=20261018";

    // Flag para evitar redirección prematura durante el registro
    let isRegistering = false;

    // Si ya hay sesión activa, ir directo al dashboard
    onAuthChange((user) => {
      if (isRegistering) return; // esperar a que register() termine
      const BASE = window.location.pathname.replace(/\/pages\/.*$/, "");
      if (user) window.location.href = BASE + "/pages/dashboard.html";
    });

    // ── Tabs ──────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === "login";
      document.getElementById("section-login").style.display    = isLogin ? "block" : "none";
      document.getElementById("section-register").style.display = isLogin ? "none"  : "block";
      document.getElementById("tab-login-btn").classList.toggle("active", isLogin);
      document.getElementById("tab-register-btn").classList.toggle("active", !isLogin);
    };

    // ── Login ─────────────────────────────────────────────
    async function handleLogin() {
      const email    = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errEl    = document.getElementById("login-error");
      const btn      = document.getElementById("btn-login");

      errEl.classList.remove("show");
      if (!email || !password) {
        errEl.textContent = "Completa todos los campos.";
        errEl.classList.add("show");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Ingresando...";

      try {
        await login(email, password);
        // onAuthChange se encarga de redirigir
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Ingresar";
        errEl.textContent = translateFirebaseError(err.code);
        errEl.classList.add("show");
      }
    };

    // ── Registro ──────────────────────────────────────────
    async function handleRegister() {
      const email  = document.getElementById("reg-email").value.trim();
      const pass1  = document.getElementById("reg-password").value;
      const pass2  = document.getElementById("reg-password2").value;
      const errEl  = document.getElementById("register-error");
      const btn    = document.getElementById("btn-register");

      errEl.classList.remove("show");

      if (!email || !pass1 || !pass2) {
        errEl.textContent = "Completa todos los campos.";
        errEl.classList.add("show");
        return;
      }
      if (pass1 !== pass2) {
        errEl.textContent = "Las contraseñas no coinciden.";
        errEl.classList.add("show");
        return;
      }
      if (pass1.length < 6) {
        errEl.textContent = "La contraseña debe tener al menos 6 caracteres.";
        errEl.classList.add("show");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creando cuenta...";
      isRegistering = true;

      try {
        await register(email, pass1);
        // Registro completo incluyendo categorías por defecto — ahora sí redirigir
        isRegistering = false;
        const BASE = window.location.pathname.replace(/\/pages\/.*$/, "");
        window.location.href = BASE + "/pages/dashboard.html";
      } catch (err) {
        isRegistering = false;
        btn.disabled = false;
        btn.textContent = "Crear cuenta";
        errEl.textContent = translateFirebaseError(err.code);
        errEl.classList.add("show");
      }
    };

    // ── Traducción de errores Firebase ────────────────────
    function translateFirebaseError(code) {
      const map = {
        "auth/invalid-email":          "El correo no es válido.",
        "auth/user-not-found":         "No existe una cuenta con ese correo.",
        "auth/wrong-password":         "Contraseña incorrecta.",
        "auth/email-already-in-use":   "Ya existe una cuenta con ese correo.",
        "auth/weak-password":          "La contraseña es muy débil.",
        "auth/too-many-requests":      "Demasiados intentos. Intenta más tarde.",
        "auth/network-request-failed": "Error de conexión. Revisa tu internet.",
      };
      return map[code] || "Ocurrió un error. Intenta de nuevo.";
    }

    document.getElementById("tab-login-btn").addEventListener("click", () => switchTab("login"));
    document.getElementById("tab-register-btn").addEventListener("click", () => switchTab("register"));
    document.getElementById("btn-login").addEventListener("click", handleLogin);
    document.getElementById("btn-register").addEventListener("click", handleRegister);

    // Enter para submit
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;
      const activeSection = document.getElementById("section-login").style.display !== "none"
        ? "login" : "register";
      if (activeSection === "login") handleLogin();
      else handleRegister();
    });
  </script>
</body>
</html>
